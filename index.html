<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VET GODS · Veterinary Morph Institute</title>
<style>
:root{
  --bg:#050b13;--bg2:#07131f;--panel:#0b1926;--panel2:#0e2231;
  --line:#27495c;--line2:#3d6d7f;--cyan:#79e7ff;--mint:#7cf0b1;
  --gold:#ffd66f;--red:#ff7d8e;--violet:#bd9cff;--text:#eef9ff;--muted:#8faebb;
  --shadow:0 14px 36px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html{overflow-y:scroll;overflow-x:hidden;scroll-behavior:auto;background:var(--bg)}
body{
  margin:0;min-height:100vh;overflow-x:hidden;overflow-y:visible;
  font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 12% 0%,rgba(76,191,255,.11),transparent 27%),
    radial-gradient(circle at 89% 11%,rgba(170,100,255,.08),transparent 25%),
    linear-gradient(180deg,#040911,#07121c 42%,#050b12);
}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.42}
a{color:inherit}
#app{min-height:100vh}
.top-shell{
  position:sticky;top:0;z-index:1000;
  background:rgba(4,10,17,.96);backdrop-filter:blur(13px);
  border-bottom:1px solid #203c4c;box-shadow:0 8px 25px rgba(0,0,0,.28)
}
.brand-row{
  max-width:1500px;margin:auto;padding:11px 18px 9px;
  display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center
}
.brand{display:flex;gap:12px;align-items:center}
.sig{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  border:1px solid #4b7990;background:
    radial-gradient(circle at 38% 32%,#7ce7ff 0 3%,transparent 4%),
    conic-gradient(from 20deg,#11364b,#351f5d,#133d31,#11364b);
  box-shadow:inset 0 0 19px #76eaff30,0 0 20px #65dfff15;font-size:22px
}
.brand h1{font-size:17px;letter-spacing:.16em;margin:0;font-weight:1000}
.brand .sub{font-size:8px;color:var(--muted);letter-spacing:.12em;margin-top:3px}
.resources{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.chip{
  border:1px solid #294f63;background:#0a1b27;border-radius:9px;
  padding:6px 9px;min-width:86px
}
.chip b{display:block;color:#8eabba;font-size:7px;letter-spacing:.08em}
.chip span{font-size:11px;font-weight:900}
.nav-wrap{max-width:1500px;margin:auto;padding:0 18px 10px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{
  border:1px solid #27495b;border-radius:8px;background:#0a1721;color:#a6bfca;
  min-height:34px;padding:6px 10px;font-size:8px;font-weight:900;letter-spacing:.03em
}
.nav button.active{background:#13384a;border-color:#6bcde6;color:#effcff;box-shadow:inset 0 0 18px #55dcff12}
.nav button.done{border-color:#356b51;color:#83e4ac}
.nav button.locked{opacity:.33}
.nav button.meta{border-color:#554578;color:#ccb7ff}
main{max-width:1500px;margin:auto;padding:16px 18px 70px}
.hero{
  position:relative;overflow:hidden;border:1px solid #315468;border-radius:18px;
  background:
    radial-gradient(circle at 83% 25%,rgba(131,113,255,.16),transparent 22%),
    radial-gradient(circle at 25% 0%,rgba(76,215,255,.12),transparent 32%),
    linear-gradient(135deg,#0b1a27,#08121d);
  box-shadow:var(--shadow);padding:18px;margin-bottom:13px
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.23;
  background-image:
    linear-gradient(rgba(105,218,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(105,218,255,.08) 1px,transparent 1px);
  background-size:34px 34px;mask-image:linear-gradient(90deg,transparent,#000 45%,#000)
}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.4fr .6fr;gap:20px;align-items:center}
.eyebrow{font-size:8px;letter-spacing:.2em;color:#7ddcf5;font-weight:1000;text-transform:uppercase}
.hero h2{font-size:29px;line-height:1.05;margin:7px 0 8px;letter-spacing:-.02em}
.hero p{margin:0;color:#a3bfcb;max-width:790px;font-size:11px;line-height:1.65}
.creature-emblem{
  min-height:160px;border:1px solid #315368;border-radius:16px;
  background:radial-gradient(circle at 50% 45%,#17394a,#09131e 65%);
  display:grid;place-items:center;position:relative;overflow:hidden
}
.creature-emblem .animal{font-size:76px;filter:drop-shadow(0 0 16px #6edfff38)}
.creature-emblem .ring{position:absolute;width:135px;height:135px;border:1px solid #5cd8ff52;border-radius:50%}
.creature-emblem .ring:before,.creature-emblem .ring:after{content:"";position:absolute;border-radius:50%;inset:10px;border:1px dashed #8adfff35}
.creature-emblem .ring:after{inset:-16px;border-style:solid;border-color:#9b7dff24}
.status-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.status-pill{
  padding:6px 9px;border:1px solid #2c5061;border-radius:999px;background:#07141d;
  font-size:8px;color:#a7c3ce
}
.status-pill strong{color:#f1fbff}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.7fr);gap:13px}
.panel{
  border:1px solid #29495a;border-radius:14px;background:linear-gradient(180deg,#0a1824,#09141e);
  box-shadow:0 9px 24px rgba(0,0,0,.22);padding:13px;margin-bottom:12px
}
.panel h3{font-size:11px;letter-spacing:.08em;margin:0 0 8px}
.panel h4{font-size:9px;letter-spacing:.06em;margin:12px 0 7px;color:#cdebf4}
.muted{color:var(--muted)}
.small{font-size:8px;line-height:1.5}
.callout{
  border-left:3px solid var(--cyan);padding:8px 10px;background:#0b202d;border-radius:0 8px 8px 0;
  font-size:9px;color:#b9d2dc;line-height:1.55;margin:9px 0
}
.callout.good{border-left-color:var(--mint)}
.callout.warn{border-left-color:var(--gold)}
.callout.danger{border-left-color:var(--red)}
.stagebar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:13px}
.stage{
  height:5px;border-radius:8px;background:#172a36;border:1px solid #243c49
}
.stage.done{background:#2a8b5a;border-color:#4acc83}
.stage.current{background:#34a9ca;border-color:#65defd;box-shadow:0 0 10px #57dfff44}
.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}
.action-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.action{
  min-height:62px;text-align:left;border:1px solid #305467;border-radius:10px;
  background:linear-gradient(180deg,#102534,#0b1b27);color:#effbff;padding:10px
}
.action:hover:not(:disabled){border-color:#62bdd6;background:#123042}
.action.done{border-color:#397d58;background:#112b22}
.action strong{display:block;font-size:9px;letter-spacing:.04em}
.action span{display:block;font-size:8px;color:#8faebb;line-height:1.45;margin-top:3px}
.gate{
  border:1px solid #426374;border-radius:12px;background:#08141e;padding:11px;margin-top:12px
}
.gate.good{border-color:#3e7657;background:#0c1f18}
.gate h4{margin:0 0 6px;font-size:9px}
.gate-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.check{
  border:1px solid #263f4c;border-radius:7px;padding:6px;background:#091822;font-size:8px;color:#9fb8c3
}
.check.ok{border-color:#34694d;color:#82dfaa;background:#0d2118}
.footer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.primary,.secondary,.danger-btn{
  border-radius:9px;min-height:40px;padding:8px 13px;font-size:8px;font-weight:1000;letter-spacing:.04em
}
.primary{border:1px solid #56bdd7;background:#123d50;color:#effdff}
.secondary{border:1px solid #4c6672;background:#0b1a24;color:#bad0d9}
.danger-btn{border:1px solid #8a4852;background:#33151d;color:#ffd8de}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.metric{border:1px solid #294553;border-radius:9px;padding:8px;background:#081620}
.metric b{font-size:7px;color:#82a3b2;display:block}
.metric .num{font-size:16px;font-weight:1000;margin-top:2px}
.bar{height:6px;background:#13252f;border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#49b6d7,#7ae6b0);width:50%}
.log{
  max-height:none;border:1px solid #263f4b;border-radius:9px;background:#061019;padding:8px;
  font-size:8px;line-height:1.55;color:#93adba
}
.log div+div{margin-top:4px;padding-top:4px;border-top:1px solid #142630}
.morph-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.morph-card{
  position:relative;border:1px solid #345466;border-radius:13px;background:#0a1823;padding:12px;
  min-height:286px
}
.morph-card.selected{border-color:#8c7be9;box-shadow:0 0 0 1px #8e7df25e,0 0 24px #7d6fff18}
.morph-icon{font-size:42px}
.morph-card h3{font-size:14px;margin:7px 0 3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
.tag{font-size:7px;border:1px solid #38586a;border-radius:999px;padding:3px 6px;color:#9fc4d0}
.procon{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.procon div{font-size:8px;line-height:1.45;border:1px solid #263f4b;border-radius:7px;padding:6px}
.procon .pro{color:#93e9b4}.procon .con{color:#ffadba}
.ability-list{display:grid;gap:5px;margin-top:8px}
.ability{font-size:8px;border:1px solid #27424e;border-radius:7px;padding:6px;background:#07141d}
.phase{
  border:1px solid #294b5d;border-radius:10px;padding:9px;background:#081721;margin-bottom:7px
}
.phase.current{border-color:#62c7df;background:#0d2633}
.phase.done{border-color:#377054;background:#0b2018}
.phase-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.phase-name{font-size:9px;font-weight:1000}
.phase-state{font-size:7px;color:#89a7b4}
.world-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.world{
  border:1px solid #345262;border-radius:12px;padding:11px;background:#0a1823
}
.world.selected{border-color:#c09cff;background:#18132b}
.world h3{font-size:11px;margin:0 0 5px}
.world p{font-size:8px;color:#91aebb;line-height:1.5;margin:0}
.sanctuary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pet{
  border:1px solid #345366;border-radius:13px;background:#0a1924;padding:11px
}
.pet .face{font-size:36px}
.pet h3{font-size:12px;margin:5px 0 2px}
.pet-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.pet-actions button{min-height:33px;border:1px solid #315464;border-radius:7px;background:#102735;color:#dff7ff;font-size:7px;font-weight:900}
.codex-table{width:100%;border-collapse:collapse;font-size:8px}
.codex-table th,.codex-table td{border-bottom:1px solid #1f3845;padding:8px;text-align:left;vertical-align:top}
.codex-table th{color:#86a7b5;font-size:7px;letter-spacing:.08em}
.empty{padding:22px;text-align:center;border:1px dashed #345364;border-radius:12px;color:#88a6b4;font-size:9px}
.modal{
  position:fixed;inset:0;z-index:5000;display:none;place-items:center;padding:20px;
  background:rgba(1,5,9,.82);backdrop-filter:blur(8px)
}
.modal.open{display:grid}
.modal-card{
  width:min(720px,96vw);border:1px solid #54778a;border-radius:18px;
  background:linear-gradient(180deg,#0c1e2c,#08131e);box-shadow:0 30px 80px #0009;padding:18px
}
.modal-card h2{font-size:24px;margin:7px 0}
.reward-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.reward{border:1px solid #315264;border-radius:9px;padding:9px;background:#081620;text-align:center}
.reward b{font-size:15px;display:block}.reward span{font-size:7px;color:#8facb8}
.toast{
  position:fixed;right:18px;bottom:18px;z-index:6000;max-width:360px;
  border:1px solid #3f6a7d;border-radius:10px;background:#0a1b27;color:#dff8ff;
  padding:10px 12px;font-size:8px;line-height:1.45;box-shadow:var(--shadow);display:none
}
.toast.show{display:block}
@media(max-width:1050px){
  .grid,.hero-grid{grid-template-columns:1fr}
  .morph-grid,.sanctuary-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
  .brand-row{grid-template-columns:1fr}.resources{justify-content:flex-start}
  .action-grid,.action-grid.three,.morph-grid,.sanctuary-grid,.world-grid{grid-template-columns:1fr}
  .gate-list{grid-template-columns:1fr}.stagebar{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>

  const p=state.sanctuary[i];updateResident(p);
  if(a==="food"){p.energy=clamp(p.energy+12);p.health=clamp(p.health+2)}
  if(a==="water"){p.hydration=clamp(p.hydration+20)}
  if(a==="comfort"){p.comfort=clamp(p.comfort+16);p.bond=clamp(p.bond+6)}
  if(a==="train"){p.mastery=clamp((p.mastery||0)+8);p.energy=clamp(p.energy-5);p.bond=clamp(p.bond+3)}
  p.lastUpdate=Date.now();save();render();
}
function careAll(){
  state.sanctuary.forEach(p=>{updateResident(p);p.hydration=clamp(p.hydration+14);p.energy=clamp(p.energy+8);p.comfort=clamp(p.comfort+10);p.health=clamp(p.health+1);p.lastUpdate=Date.now()});
  log("Morph Sanctuary baseline care completed for all residents.");save();render();toast("All sanctuary residents received baseline care.");
}

function codexScreen(){
  const entries=Object.values(state.codex);
  return hero("Morph Codex",
    "The Codex grows from evidence, morph choices, field use and sanctuary life. Individuals remain meaningful because temperament, branch and mastery persist.","📚")
  +`<div class="panel">${entries.length?`<table class="codex-table"><thead><tr><th>CREATURE</th><th>BASE</th><th>MORPH FORM</th><th>TRAITS / TAGS</th><th>FIELD RECORD</th><th>COMPLETENESS</th></tr></thead>
    <tbody>${entries.map(e=>`<tr><td><b>${e.icon} ${e.name}</b><br>${e.temperament}</td><td>${e.species}</td><td><b>${e.formName}</b><br>${e.theme}</td><td>${e.tags.join(", ")}</td><td>${e.world}<br>${e.objective}</td><td>${e.complete}%</td></tr>`).join("")}</tbody></table>`
    :`<div class="empty">The Codex is empty. Complete your first morph expedition to publish a full research record.</div>`}</div>`;
}

function render(){
  document.getElementById("resourceBar").innerHTML=resourceBar();
  document.getElementById("nav").innerHTML=nav();
  let html="";
  if(state.screen==="institute")html=instituteScreen();
  else if(state.screen==="sanctuary")html=sanctuaryScreen();
  else if(state.screen==="codex")html=codexScreen();
  else if(state.screen==="worldmap")html=worldMapScreen();
  else{
    const id=stageId();
    html=({intake:intakeScreen,triage:triageScreen,exam:examScreen,diagnostics:diagnosticsScreen,treatment:treatmentScreen,vetrecovery:vetRecoveryScreen,eligibility:eligibilityScreen,resonance:resonanceScreen,prep:prepScreen,tree:treeScreen,chamber:chamberScreen,recovery:recoveryScreen,training:trainingScreen,expedition:expeditionScreen}[id]||intakeScreen)();
  }
  document.getElementById("main").innerHTML=html;
  save();
}
function goStage(i){
  const c=active();
  if(i>c.stage&&!c.completedStages.includes(i)){toast("That area is still locked. Finish the current area first.");return}
  state.screen=STAGES[i].id;save();render();
}
function goMeta(id){state.screen=id;save();render()}
function finishArea(){
  const c=active(),i=c.stage;
  if(!canFinish(i)){toast("The completion gate is not ready yet.");return}
  c.areaComplete=true;if(!c.completedStages.includes(i))c.completedStages.push(i);
  log(STAGES[i].label+" completed for "+c.name+".");save();render();
}
function continueStage(){
  const c=active();if(!c.areaComplete)return;
  c.stage=Math.min(13,c.stage+1);c.areaComplete=false;state.screen=STAGES[c.stage].id;log("Entered "+STAGES[c.stage].label+".");save();render();
}
function canFinish(i){
  const c=active();
  if(i===0)return !!(c.intakeBrief&&c.intakeVitals&&c.intakeCalm);
  if(i===1){const t=c.vet.triage;return t.airway&&t.breathing&&t.circulation&&t.temp&&t.weight&&c.vet.oxygen>=94}
  if(i===2)return Object.values(c.vet.exam).every(Boolean);
  if(i===3)return Object.values(c.vet.dx).every(Boolean);
  if(i===4){const t=c.vet.treatment;return Object.values(t).every(Boolean)&&c.pain<=30&&c.hydration>=70}
  if(i===5){const r=c.vet.recovery;return Object.values(r).every(Boolean)&&c.health>=82&&c.pain<=25&&c.hydration>=75&&c.vet.oxygen>=95}
  if(i===6)return c.vet.dx.assessment&&c.vet.treatment.primary&&c.vet.recovery.recheck&&c.health>=82&&c.pain<=25&&c.hydration>=75&&c.vet.oxygen>=95&&c.stress<40;
  if(i===7)return Object.values(c.evidence).every(Boolean);
  if(i===8)return c.hydration>=70&&c.energy>=68&&c.comfort>=68&&c.trust>=55&&c.prep.calibrate&&c.prep.catalyst;
  if(i===9)return !!c.selectedMorph&&c.completedStages.includes(8);
  if(i===10)return c.chamber.phase>=CHAMBER_PHASES.length&&c.chamber.stability>=60&&c.chamber.integrity>=60;
  if(i===11)return c.recovery.adaptation>=80&&c.hydration>=70&&c.stress<40&&c.comfort>=70&&c.recovery.environment;
  if(i===12)return Object.values(c.training).every(Boolean);
  if(i===13)return !!c.expedition.world&&c.expedition.brief&&c.expedition.route&&c.expedition.objective&&c.expedition.extract;
  return false;
}

function completeCreatureCase(){
  const c=active();if(!c.areaComplete||c.stage!==13)return;
  const m=morph(),w=WORLDS.find(x=>x.id===c.expedition.world);
  const exists=state.sanctuary.some(x=>x.caseKey===c.key);
  if(!exists){
    state.sanctuary.push({
      caseKey:c.key,name:c.name,species:c.species,icon:m.icon,formName:m.name,theme:m.theme,temperament:c.temperament,
      habitat:m.habitat,tags:m.tags,health:90,hydration:82,energy:72,comfort:80,bond:clamp(c.bond+10),mastery:18,lastUpdate:Date.now()
    });
  }
  state.codex[c.key]={
    name:c.name,species:c.species,icon:m.icon,formName:m.name,theme:m.theme,temperament:c.temperament,tags:m.tags,
    world:w.name+" · "+w.biome,objective:w.objective,complete:78
  };
  state.completedCases+=1;state.research+=12;state.credits+=125;state.rank=1+Math.floor(state.completedCases/2);state.chapter=1+state.completedCases;
  save();
  showReward(c,m,w);
}
function showReward(c,m,w){
  const modal=document.getElementById("rewardModal");
  document.getElementById("rewardCard").innerHTML=`<div class="eyebrow">CASE COMPLETE · MORPH SANCTUARY ADMISSION</div>
    <h2>${m.icon} ${c.name} became ${m.name}</h2>
    <div class="small muted">${c.species} · ${m.theme}<br>Field certification: ${w.name} · ${w.biome}</div>
    <div class="reward-grid"><div class="reward"><b>+125</b><span>CREDITS</span></div><div class="reward"><b>+12</b><span>RESEARCH</span></div><div class="reward"><b>+1</b><span>CODEX MORPH</span></div></div>
    <div class="callout good">${c.name} now lives permanently in the Morph Sanctuary. This case is archived; the transformed creature will not disappear.</div>
    <div class="footer-actions"><button class="primary" onclick="closeRewardToSanctuary()">OPEN MORPH SANCTUARY</button>
    <button class="secondary" onclick="closeRewardToCodex()">VIEW CODEX RECORD</button></div>`;
  modal.classList.add("open");
}
function closeRewardToSanctuary(){document.getElementById("rewardModal").classList.remove("open");state.screen="sanctuary";save();render()}
function closeRewardToCodex(){document.getElementById("rewardModal").classList.remove("open");state.screen="codex";save();render()}
function startNextCreature(){
  const next=(state.activeIndex+1)%CREATURES.length;
  state.activeIndex=next;state.creature=createCreature(CREATURES[next]);state.screen="intake";state.catalystStock=Math.max(state.catalystStock,2);
  log("New rescue assigned: "+state.creature.name+" the "+state.creature.species+".");save();render();window.scrollTo(0,0);
}
function resetGame(){
  if(!confirm("Reset VET GODS save data and restart Koda's case?"))return;
  localStorage.removeItem(SAVE_KEY);state=defaultState();state.creature=createCreature(CREATURES[0]);save();render();window.scrollTo(0,0);
}

window.goStage=goStage;window.goMeta=goMeta;window.finishArea=finishArea;window.continueStage=continueStage;
window.intakeAction=intakeAction;window.vetTriage=vetTriage;window.vetExam=vetExam;window.vetDx=vetDx;window.vetTreat=vetTreat;window.vetRecover=vetRecover;window.clearForMorph=clearForMorph;window.scan=scan;window.prep=prep;window.selectMorph=selectMorph;window.chamberAction=chamberAction;
window.recover=recover;window.train=train;window.pickWorld=pickWorld;window.field=field;window.completeCreatureCase=completeCreatureCase;
window.closeRewardToSanctuary=closeRewardToSanctuary;window.closeRewardToCodex=closeRewardToCodex;window.startNextCreature=startNextCreature;
window.petCare=petCare;window.careAll=careAll;window.resetGame=resetGame;

render();
})();
</script>
</body>
</html>
