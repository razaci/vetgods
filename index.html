<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VET GODS · Rebuilt Clean</title>
<style>
:root{
  --bg:#07131d;--panel:#0d2231;--panel2:#102b3d;--line:#2a9ac8;
  --text:#edfaff;--muted:#8fb7c7;--green:#41cf8b;--gold:#efc45e;--red:#ef6d74;
}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(#07131d,#081922);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
button{font:inherit}
#app{max-width:1180px;margin:auto;padding:12px}
.top{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:10px
}
.brand{
  background:linear-gradient(135deg,#12324a,#0b1f2d);
  border:1px solid rgba(91,198,238,.28);border-radius:16px;padding:16px
}
.brand h1{margin:0;font-size:30px;letter-spacing:.06em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:#0b2130;border:1px solid rgba(91,198,238,.25);border-radius:12px;padding:10px 12px;font-size:12px}
.nav{
  display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px
}
.nav button{
  min-height:52px;border-radius:12px;border:1px solid rgba(91,198,238,.25);
  background:#0b2130;color:var(--text);cursor:pointer
}
.nav button.active{background:#15415b;border-color:#52c8f1}
.screen{display:none}
.screen.active{display:block}
.panel{
  background:linear-gradient(180deg,var(--panel),#091a27);
  border:1px solid rgba(91,198,238,.22);border-radius:16px;padding:14px;margin-bottom:10px
}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:10px}
.hero{
  display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center
}
.hero img,.patient-card img,.dept-card img{
  width:100%;display:block;object-fit:contain;background:#081822;border-radius:12px
}
.hero img{aspect-ratio:1.35/1}
.patient-card img,.dept-card img{aspect-ratio:1.35/1}
h2,h3{margin:0 0 8px}
.small{font-size:12px;color:var(--muted)}
.roster{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px
}
.patient-card,.dept-card{
  border:1px solid rgba(91,198,238,.22);background:#0a1c29;border-radius:12px;padding:8px;
  min-width:0
}
.patient-card button,.dept-card button,.action{
  width:100%;border:1px solid rgba(91,198,238,.3);background:#123148;color:var(--text);
  border-radius:9px;padding:9px;cursor:pointer;margin-top:6px
}
.action.green{background:#126443;border-color:#3acf8b}
.action.gold{background:#6f5314;border-color:#d7ae4c}
.action.red{background:#6b262d;border-color:#d85c65}
.meter{height:12px;background:#06121b;border-radius:999px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#47d49a,#e7c95e,#eb7278)}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.controls button{min-height:70px}
.dept-counts{display:flex;gap:8px;flex-wrap:wrap}
.empty{
  border:1px dashed rgba(91,198,238,.22);border-radius:12px;padding:20px;text-align:center;color:var(--muted)
}
.log{max-height:180px;overflow:auto;font-size:12px;line-height:1.45}
@media(max-width:760px){
  .top,.grid2{grid-template-columns:1fr}
  .stats{justify-content:flex-start}
  .nav{grid-template-columns:repeat(3,1fr)}
  .hero{grid-template-columns:1fr}
  .roster{grid-template-columns:repeat(3,minmax(0,1fr))}
}

.pet-home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pet-sim{
  background:linear-gradient(180deg,#0c2433,#091924);
  border:1px solid rgba(91,198,238,.22);border-radius:16px;padding:12px
}
.pet-top{display:grid;grid-template-columns:150px 1fr;gap:12px}
.pet-top img{width:100%;aspect-ratio:1.2/1;object-fit:contain;background:#081822;border-radius:12px}
.pet-needs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}
.need{font-size:11px}
.pet-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pet-actions button{min-height:46px}
.memory-list,.relationship-list{display:grid;gap:6px;margin-top:8px}
.memory{
  padding:8px;border-radius:10px;background:#0a1b27;border:1px solid rgba(91,198,238,.16);
  font-size:11px
}
.today-box{
  background:#081c29;border-left:3px solid var(--gold);padding:10px;border-radius:10px;margin:8px 0
}
.trust-stage{font-size:12px;color:var(--gold);font-weight:700}
.pet-alert{font-size:11px;color:#ffd8a0}
.pet-good{font-size:11px;color:#aaf2cf}
.pet-home-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
@media(max-width:760px){
 .pet-home-grid{grid-template-columns:1fr}
 .pet-top{grid-template-columns:1fr}
 .pet-actions{grid-template-columns:repeat(2,1fr)}
}


.exp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.exp-card{background:#0a1d2a;border:1px solid rgba(91,198,238,.2);border-radius:13px;padding:11px;min-width:0}
.exp-card h3{font-size:14px}
.exp-card button{width:100%;min-height:44px;margin-top:7px;border:1px solid rgba(91,198,238,.28);background:#123148;color:var(--text);border-radius:9px}
.case-test{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.book-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.book-entry{background:#091b27;border-left:3px solid var(--green);padding:10px;border-radius:10px;font-size:12px}
.progressbar{height:8px;background:#06121b;border-radius:9px;overflow:hidden;margin:5px 0}.progressbar i{display:block;height:100%;background:#54b8d9}
.event-banner{border:1px solid rgba(239,196,94,.4);background:#352b12;border-radius:12px;padding:12px;margin-bottom:10px}
.staff-row,.upgrade-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid rgba(255,255,255,.07);padding:8px 0}
@media(max-width:760px){.exp-grid,.book-grid{grid-template-columns:1fr}.case-test{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}}


.econ-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.econ-card{background:#0a1d2a;border:1px solid rgba(91,198,238,.2);border-radius:13px;padding:11px}
.queue-row,.inventory-row,.finance-row,.research-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#173246;font-size:11px;margin-right:5px}
.badge.urgent{background:#6a2a2e}.badge.good{background:#164d38}.badge.gold{background:#5d4b18}
.report{background:#071823;border:1px solid rgba(91,198,238,.18);border-radius:12px;padding:12px;line-height:1.55}
@media(max-width:760px){.econ-grid{grid-template-columns:1fr}}


/* ===== ANIMAL-FIRST SIM LAYER ===== */
.animal-world{display:grid;gap:10px}
.animal-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.animal-tile{
  background:linear-gradient(180deg,#0b2230,#081822);
  border:1px solid rgba(120,210,235,.18);
  border-radius:14px;padding:8px;min-width:0;position:relative
}
.animal-tile img{width:100%;aspect-ratio:1.25/1;object-fit:contain;background:#06131c;border-radius:10px}
.animal-tile b{display:block;margin-top:5px;font-size:12px}
.animal-tile .small{font-size:10px}
.animal-status{margin-top:5px;padding:5px 7px;border-radius:8px;background:#102b38;font-size:10px}
.animal-status.alert{background:#43262b}
.animal-status.calm{background:#14372f}
.dept-scene{
  border:1px solid rgba(120,210,235,.18);
  border-radius:16px;padding:12px;margin-bottom:10px;
  background:linear-gradient(180deg,#0a202d,#071720)
}
.dept-scene h3{margin:0 0 8px}
.sim-event{
  border-left:3px solid var(--gold);padding:8px 10px;margin:7px 0;
  background:#10222d;border-radius:8px;font-size:11px
}
.animal-care-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.animal-care-grid button{min-height:44px}
.resident-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.animal-focus-card{display:grid;grid-template-columns:150px 1fr;gap:12px}
.animal-focus-card img{width:100%;aspect-ratio:1.25/1;object-fit:contain;border-radius:12px;background:#06131c}
@media(max-width:760px){
 .animal-focus-card{grid-template-columns:1fr}
 .animal-care-grid{grid-template-columns:repeat(2,1fr)}
}


/* ===== GAMEPLAY TREE UI ===== */
.tree-shell{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);gap:10px}
.tree-stage{background:linear-gradient(180deg,#0a202d,#071720);border:1px solid rgba(120,210,235,.2);border-radius:16px;padding:12px}
.tree-patient{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:start}
.tree-patient img{width:100%;aspect-ratio:1.2/1;object-fit:contain;background:#06131c;border-radius:13px}
.tree-observation{font-size:14px;line-height:1.5;padding:10px;border-radius:10px;background:#0e2734;margin:8px 0}
.tree-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tree-actions button{min-height:52px}
.tree-log{display:grid;gap:6px}
.tree-log div{font-size:11px;padding:7px;background:#091b27;border-radius:8px}
.tree-path{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.tree-node{font-size:10px;padding:5px 7px;border-radius:999px;background:#173040}
.tree-node.done{background:#184638}.tree-node.now{background:#5a4819}
.ward-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px}
.ward-animal{padding:8px;background:#091c28;border-radius:12px;border:1px solid rgba(120,210,235,.16)}
.ward-animal img{width:100%;aspect-ratio:1.25/1;object-fit:contain;border-radius:8px;background:#06131c}
.ward-animal button{width:100%;margin-top:5px;min-height:38px}
@media(max-width:760px){.tree-shell,.tree-patient{grid-template-columns:1fr}.tree-actions{grid-template-columns:1fr}}


/* ===== DENSE ANIMAL STRIP PATCH ===== */
.dept-scene{
  padding:8px;
  margin-bottom:8px;
}
.dept-scene .resident-label{
  margin-bottom:5px;
}
.animal-strip{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(72px,1fr));
  gap:6px;
}
.animal-tile{
  padding:5px;
  border-radius:10px;
  min-height:0;
}
.animal-tile img{
  width:100%;
  aspect-ratio:1/0.72;
  max-height:72px;
  object-fit:contain;
  border-radius:7px;
}
.animal-tile b{
  margin-top:3px;
  font-size:10px;
  line-height:1.1;
}
.animal-tile .small{
  font-size:8.5px;
  line-height:1.15;
}
.animal-status{
  margin-top:3px;
  padding:3px 4px;
  font-size:8.5px;
  line-height:1.15;
}
.sim-event{
  padding:6px 8px;
  margin:5px 0 7px;
  font-size:10px;
}
.ward-board{
  grid-template-columns:repeat(auto-fit,minmax(92px,1fr));
  gap:6px;
}
.ward-animal{
  padding:6px;
  border-radius:10px;
}
.ward-animal img{
  max-height:84px;
  aspect-ratio:1/0.78;
}
.ward-animal b{
  font-size:10px;
}
.ward-animal .small{
  font-size:8.5px;
  line-height:1.15;
}
.ward-animal button{
  min-height:32px;
  font-size:9px;
  padding:5px 6px;
}
.tree-shell{
  margin-top:6px;
}
.tree-stage{
  padding:10px;
}
.tree-patient{
  grid-template-columns:128px 1fr;
  gap:10px;
}
.tree-patient img{
  max-height:112px;
}
.tree-observation{
  margin:6px 0;
  padding:8px;
  font-size:12px;
}
.tree-actions{
  gap:6px;
  margin-top:8px;
}
.tree-actions button{
  min-height:44px;
}
@media(max-width:760px){
  .animal-strip{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ward-board{grid-template-columns:repeat(3,minmax(0,1fr))}
  .animal-tile img{max-height:58px}
  .ward-animal img{max-height:66px}
  .tree-patient{grid-template-columns:96px 1fr}
  .tree-patient img{max-height:90px}
}


/* ===== SOFT + SQUISHY UI THEME ===== */
:root{
  --soft-bg:#0b1820;
  --soft-panel:#132630;
  --soft-panel-2:#18313d;
  --soft-edge:rgba(188,226,236,.16);
  --soft-glow:rgba(125,205,226,.10);
  --soft-text:#edf8fb;
  --soft-muted:#b8cbd2;
}
body{
  background:
    radial-gradient(circle at 20% 0%,rgba(108,190,214,.10),transparent 28%),
    radial-gradient(circle at 100% 10%,rgba(177,145,216,.08),transparent 24%),
    linear-gradient(180deg,#0b171f,#0d1d25 55%,#0b171f);
  color:var(--soft-text);
}
.panel,.dept-scene,.tree-stage,.exp-card,.econ-card,.animal-tile,.ward-animal,.book-entry,.report{
  background:
    linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),
    var(--soft-panel);
  border:1px solid var(--soft-edge);
  border-radius:20px;
  box-shadow:
    0 8px 22px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.035);
}
.panel,.dept-scene,.tree-stage{padding:14px}
.nav{
  gap:8px;
}
.nav button,
button,
.action{
  border-radius:16px !important;
  border:1px solid rgba(190,230,240,.16) !important;
  background:
    linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015)),
    #17303c !important;
  color:var(--soft-text) !important;
  box-shadow:
    0 5px 12px rgba(0,0,0,.16),
    inset 0 1px 0 rgba(255,255,255,.05) !important;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
}
button:active,.action:active{
  transform:translateY(1px) scale(.985);
  box-shadow:
    0 2px 6px rgba(0,0,0,.18),
    inset 0 2px 6px rgba(0,0,0,.10) !important;
}
.action.green{
  background:
    linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01)),
    #1d4b40 !important;
}
.animal-tile,.ward-animal{
  border-radius:18px;
  padding:8px;
}
.animal-tile img,.ward-animal img,.tree-patient img,.animal-focus-card img,.dept-card img{
  border-radius:16px !important;
  background:#0b1b23 !important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);
}
.animal-status{
  border-radius:12px;
  background:#183744;
}
.animal-status.calm{background:#20463d}
.animal-status.alert{background:#55353a}
.sim-event,.tree-observation,.memory,.event-banner{
  border-radius:16px !important;
  border:1px solid rgba(255,255,255,.04);
}
.tree-observation{
  background:#17333e;
  line-height:1.55;
}
.tree-node{
  border-radius:999px;
  padding:6px 9px;
  background:#193541;
  border:1px solid rgba(255,255,255,.035);
}
.tree-node.done{background:#245144}
.tree-node.now{background:#615124}
.progressbar{
  height:10px;
  border-radius:999px;
  background:#09171e;
}
.progressbar i{
  border-radius:999px;
}
.small,.resident-label{
  color:var(--soft-muted);
}
h1,h2,h3{
  letter-spacing:.01em;
}
input,select,textarea{
  border-radius:14px !important;
  background:#102630 !important;
  color:var(--soft-text) !important;
  border:1px solid var(--soft-edge) !important;
}
.pet-home-toolbar{
  gap:8px;
}
.pet-home-grid,.exp-grid,.econ-grid,.book-grid,.grid2,.animal-strip,.ward-board{
  gap:10px;
}
.dept-card{
  border-radius:18px !important;
  background:#142b35 !important;
  border:1px solid var(--soft-edge) !important;
  box-shadow:0 6px 16px rgba(0,0,0,.16);
}
.empty{
  border-radius:16px;
  background:#10232c;
  border:1px dashed rgba(192,228,238,.15);
  padding:14px;
}
@media(max-width:760px){
  .panel,.dept-scene,.tree-stage{padding:11px}
  .nav button,button,.action{border-radius:14px !important}
}


/* ===== SMART METER OVERHAUL ===== */
.condition-cluster{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:10px 0;
}
.condition-group{
  background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),#132934;
  border:1px solid rgba(190,230,240,.13);
  border-radius:18px;
  padding:10px;
}
.condition-group h4{
  margin:0 0 7px;
  font-size:10px;
  letter-spacing:.10em;
  text-transform:uppercase;
  color:var(--soft-muted);
}
.smart-meter{
  display:grid;
  grid-template-columns:minmax(72px,.9fr) minmax(80px,1.2fr) auto;
  gap:7px;
  align-items:center;
  padding:6px 7px;
  margin:5px 0;
  border-radius:12px;
  background:#10232c;
  border:1px solid rgba(255,255,255,.035);
}
.smart-meter.priority{
  background:#2b2228;
  border-color:rgba(255,160,160,.18);
  box-shadow:inset 0 0 0 1px rgba(255,145,145,.035);
}
.smart-meter.improving{
  background:#132d29;
}
.smart-label{
  font-size:10px;
  line-height:1.15;
  min-width:0;
}
.smart-label b{font-size:10px}
.smart-label span{
  display:block;
  color:var(--soft-muted);
  font-size:8.5px;
  margin-top:2px;
}
.smart-track{
  height:10px;
  background:#08181f;
  border-radius:999px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.03);
}
.smart-fill{
  height:100%;
  width:0;
  border-radius:999px;
  background:linear-gradient(90deg,#426d78,#7fb1bf);
  transition:width .2s ease;
}
.smart-meter.bad .smart-fill{
  background:linear-gradient(90deg,#6e494d,#b26b70);
}
.smart-meter.good .smart-fill{
  background:linear-gradient(90deg,#416d60,#72ad93);
}
.smart-value{
  text-align:right;
  font-size:10px;
  white-space:nowrap;
}
.smart-delta{
  font-size:8.5px;
  margin-left:3px;
}
.smart-delta.up{color:#8fd0a8}
.smart-delta.down{color:#8fd0a8}
.smart-delta.badup{color:#e79898}
.smart-delta.baddown{color:#8fd0a8}
.condition-summary{
  margin-top:8px;
  padding:9px 11px;
  border-radius:14px;
  background:#17313b;
  border:1px solid rgba(190,230,240,.10);
  font-size:11px;
  line-height:1.45;
}
.condition-priority{
  margin-top:6px;
  font-size:9px;
  color:var(--soft-muted);
}
@media(max-width:560px){
  .condition-cluster{grid-template-columns:1fr}
  .smart-meter{grid-template-columns:minmax(78px,.9fr) 1fr auto}
}


/* ===== LONG-FORM HOSPITAL SIM ===== */
.sim-ribbon{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}
.sim-chip{background:#132b35;border:1px solid rgba(190,230,240,.12);border-radius:14px;padding:8px;text-align:center;font-size:10px}
.sim-chip b{display:block;font-size:13px}
.story-panel{background:#132934;border:1px solid rgba(190,230,240,.12);border-radius:18px;padding:11px;margin:9px 0}
.story-panel h3{margin:0 0 7px}
.objective-list{display:grid;gap:5px}
.objective{padding:7px 9px;border-radius:11px;background:#10232c;font-size:10px}
.objective.done{background:#17392f;text-decoration:line-through;opacity:.75}
.shift-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.chapter-track{display:flex;gap:5px;overflow-x:auto;padding:4px 0}
.chapter-pill{flex:0 0 auto;padding:6px 9px;border-radius:999px;background:#17303b;font-size:9px}
.chapter-pill.active{background:#5c4c24}.chapter-pill.done{background:#1d493c}
.complication{padding:8px 10px;border-radius:13px;background:#3b252b;border:1px solid rgba(255,150,150,.14);font-size:10px;margin:6px 0}
.relationship{padding:7px;border-radius:11px;background:#162d38;font-size:9px;margin-top:5px}
@media(max-width:620px){.sim-ribbon{grid-template-columns:repeat(2,1fr)}.shift-actions{grid-template-columns:1fr}}


/* ===== THREE-PILLAR CARE SYSTEM ===== */
.care-pillar-wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.care-pillar{border-radius:20px;padding:10px;border:1px solid rgba(190,230,240,.13);background:#132a34}
.care-pillar.exam{background:#153142}.care-pillar.medical{background:#18362f}.care-pillar.emotional{background:#3a2436}
.care-pillar h3{margin:0 0 7px;font-size:13px}
.choice-list{display:grid;gap:6px}
.choice-btn{min-height:42px;text-align:left;padding:8px 10px;border-radius:13px!important;font-size:10px}
.choice-btn.locked{opacity:.45}
.choice-btn.done{background:#1f463b!important}
.choice-btn .sub{display:block;font-size:8.5px;color:var(--soft-muted);margin-top:2px}
.pillar-progress{font-size:9px;color:var(--soft-muted);margin-bottom:7px}
.care-outcome{margin-top:8px;padding:8px;border-radius:12px;background:#10242d;font-size:10px;line-height:1.4}
@media(max-width:760px){.care-pillar-wrap{grid-template-columns:1fr}}


.save-panel details{background:rgba(0,0,0,.12);border-radius:14px;padding:8px}
.save-panel summary{cursor:pointer;font-weight:800}
.save-archive{display:grid;gap:7px;margin-top:8px}


.clickable-animal{cursor:pointer}
.clickable-animal:active{transform:scale(.985)}
.animal-profile .tree-patient{padding:10px;border-radius:18px;background:rgba(255,255,255,.04)}


/* VET GODS · PERFORMANCE ONLY — ORIGINAL VISUALS PRESERVED */
body{background-attachment:scroll !important;}
*{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;}
body::before,body::after,.screen::before,.screen::after{pointer-events:none !important;}


/* VET GODS · COMPACT GAME MENU */
.menu-toggle{
  position:sticky;top:8px;z-index:90;display:inline-flex;align-items:center;gap:7px;
  margin:8px 10px;padding:10px 14px;border-radius:14px;font-weight:800;letter-spacing:.04em;
  background:#f4f8fa;color:#203040;border:1px solid #c4d5dc;box-shadow:0 4px 12px rgba(20,40,60,.12);
}
.menu-toggle span{font-size:.86rem}
.game-menu{
  position:fixed;z-index:120;top:0;left:0;width:min(88vw,360px);height:100dvh;overflow-y:auto;
  padding:14px;background:#f8fbfc;border-right:1px solid #cbdce3;box-shadow:12px 0 30px rgba(20,40,60,.24);
  transform:translateX(-105%);transition:transform .18s ease;
}
.game-menu.open{transform:translateX(0)}
.menu-backdrop{
  position:fixed;z-index:110;inset:0;background:rgba(18,34,48,.36);opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.menu-backdrop.open{opacity:1;pointer-events:auto}
.game-menu-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 12px;color:#203040}
.menu-close{
  width:42px;height:42px;border-radius:12px;font-weight:900;background:#fff;color:#203040;border:1px solid #c4d5dc;
}
.game-menu-nav.nav{
  position:static !important;display:grid !important;grid-template-columns:1fr 1fr;gap:8px;
  padding:0 !important;margin:0 !important;background:transparent !important;border:0 !important;
  box-shadow:none !important;overflow:visible !important;
}
.game-menu-nav.nav button{width:100%;min-height:46px;white-space:normal}
.game-menu-nav.nav button.active{outline:2px solid rgba(70,130,160,.2)}
@media(max-width:520px){
  .menu-toggle{top:6px;margin:6px 8px;padding:9px 12px}
  .game-menu{width:88vw}
}


/* VET GODS · ALWAYS-VISIBLE QUICK LINKS */
.quick-links{
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 10px 8px;
  overflow-x:auto;
  scrollbar-width:none;
}
.quick-links::-webkit-scrollbar{display:none}
.quick-links button{
  flex:0 0 auto;
  min-height:34px;
  padding:7px 12px;
  border-radius:999px;
  font-size:.82rem;
  font-weight:800;
  background:#ffffff;
  color:#203040;
  border:1px solid #c4d5dc;
  box-shadow:0 2px 7px rgba(20,40,60,.08);
}
.quick-links button.active{
  background:#dceff6;
  border-color:#9fc8d8;
  color:#173e51;
}
@media(max-width:520px){
  .quick-links{
    gap:6px;
    padding:0 8px 7px;
  }
  .quick-links button{
    min-height:32px;
    padding:6px 10px;
    font-size:.78rem;
  }
}


/* =========================================================
   VET GODS · 500 ANIMAL DATABASE UI
   ========================================================= */
.vg-db-toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.vg-db-toolbar input,.vg-db-toolbar select{
  min-height:42px;border-radius:10px;border:1px solid #c7d6dc;background:#fff;color:#203040;padding:8px 10px;
}
.vg-db-grid{display:grid;gap:10px}
.vg-db-card{
  background:#fff;border:1px solid #d6e0e4;border-radius:14px;padding:12px;box-shadow:0 3px 10px rgba(20,40,60,.06)
}
.vg-db-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.vg-sev{font-size:.75rem;font-weight:800;padding:5px 8px;border:1px solid #ccd9de;border-radius:999px;white-space:nowrap}
.vg-problem-list{display:grid;gap:7px;margin:9px 0}
.vg-problem{border-left:3px solid #aac5d0;background:#f7fafb;border-radius:9px;padding:8px 9px}
.vg-problem-title{font-weight:800;margin-bottom:3px}
.vg-amazon{
  display:inline-block;margin-top:5px;font-size:.78rem;font-weight:800;text-decoration:none;
  color:#245a73;background:#eef6f9;border:1px solid #c7dce5;border-radius:8px;padding:5px 7px
}
.vg-db-pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.vg-db-pager button{min-height:36px;border-radius:9px;padding:6px 10px}
.vg-case-plan{margin-top:10px}
@media(max-width:520px){
  .vg-db-toolbar{grid-template-columns:1fr}
  .vg-db-head{align-items:flex-start}
  .vg-db-pager{display:grid;grid-template-columns:1fr auto 1fr}
  .vg-db-pager button{padding:6px}
}


/* VET GODS · DYNAMIC CARE PATH UI */
.vg-dynamic-care{margin-top:10px}
.vg-dynamic-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.vg-stage-pill{
  flex:0 0 auto;font-size:.72rem;font-weight:900;letter-spacing:.06em;
  padding:5px 8px;border-radius:999px;border:1px solid #c7d6dc;background:#f6fafb;color:#274554;
}
.vg-dynamic-buttons{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;
}
.vg-dynamic-buttons .action{min-height:46px}
.vg-reveal-box{
  margin-top:8px;padding:9px 10px;border-radius:10px;border:1px solid #cbdce3;background:#f7fbfc;
}
@media(max-width:520px){
  .vg-dynamic-buttons{grid-template-columns:1fr 1fr}
}

  margin-top:8px;padding:8px 10px;border-radius:10px;

}


/* =========================================================
   VET GODS · ADMIT ANIMAL ORIGINAL UI RESTORE
   Admit/database only — no cartoon card treatment.
   ========================================================= */
#admit{
  background:transparent !important;
}
#admit .panel,
#admit #vgAnimalDatabase.panel{
  background:var(--panel, #111a20) !important;
  border:1px solid var(--line, #2a3b45) !important;
  border-radius:10px !important;
  box-shadow:none !important;
  transform:none !important;
}
#admit .vg-db-card{
  background:var(--panel2, #172229) !important;
  border:1px solid var(--line, #2a3b45) !important;
  border-radius:8px !important;
  box-shadow:none !important;
  transform:none !important;
  color:inherit !important;
}
#admit .vg-problem,
#admit .vg-reveal-box{
  background:rgba(255,255,255,.035) !important;
  border-color:var(--line, #2a3b45) !important;
  border-radius:6px !important;
  color:inherit !important;
}
#admit .vg-db-toolbar input,
#admit .vg-db-toolbar select{
  background:var(--panel2, #172229) !important;
  color:inherit !important;
  border:1px solid var(--line, #2a3b45) !important;
  border-radius:6px !important;
  box-shadow:none !important;
}
#admit .vg-amazon{
  background:transparent !important;
  color:var(--accent, #73c7e6) !important;
  border:1px solid var(--line, #2a3b45) !important;
  border-radius:5px !important;
  box-shadow:none !important;
}
#admit .vg-sev,
#admit .vg-stage-pill{
  background:transparent !important;
  color:inherit !important;
  border:1px solid var(--line, #2a3b45) !important;
  border-radius:5px !important;
}
#admit .vg-db-pager button,
#admit .action{
  border-radius:6px !important;

  transform:none !important;
}
#admit .vg-db-card:hover,
#admit .vg-db-card:active,
#admit .action:hover,
#admit .action:active{

/* VET GODS · HABITAT & ENCLOSURE CENTER */
.vg-habitat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vg-habitat-card,.vg-habitat-mini{
  background:var(--panel2,#172229);
  border:1px solid var(--line,#2a3b45);
  border-radius:8px;padding:10px;box-shadow:none;
}
.vg-habitat-icon{font-size:1.6rem;margin-bottom:4px}
.vg-habitat-card .small,.vg-habitat-mini .small{margin:5px 0 8px}
.vg-habitat-buy{
  display:inline-block;padding:7px 9px;border-radius:6px;
  border:1px solid var(--line,#2a3b45);
  color:var(--accent,#73c7e6);text-decoration:none;background:transparent;
}
.vg-habitat-mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:560px){.vg-habitat-grid,.vg-habitat-mini-grid{grid-template-columns:1fr}}


/* VET GODS · MY PETS SLIDER CARE */
.pet-care-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pet-care-console{padding:10px}
.pet-care-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.pet-care-head img{
  width:86px;height:86px;object-fit:contain;border-radius:10px;
  border:1px solid var(--line,#2a3b45);background:rgba(0,0,0,.08);
}
.pet-care-head h3{margin:0 0 3px}
.pet-care-meters{display:grid;gap:9px}
.pet-slider-row{
  display:block;padding:8px;border:1px solid var(--line,#2a3b45);
  border-radius:8px;background:rgba(255,255,255,.025);
}
.pet-slider-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.pet-slider-row input[type="range"]{width:100%;margin:0;touch-action:pan-y}
.pet-care-status{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;
}
.pet-care-status>div{
  border:1px solid var(--line,#2a3b45);border-radius:7px;padding:6px;text-align:center;
}
.pet-care-status b,.pet-care-status span{display:block;font-size:.78rem}
.pet-care-status span{font-size:1rem;margin-top:2px}
.pet-care-footer{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
@media(max-width:700px){.pet-care-grid{grid-template-columns:1fr}}
@media(max-width:420px){
  .pet-care-status{grid-template-columns:repeat(2,1fr)}
  .pet-care-footer{grid-template-columns:1fr}
}


/* VET GODS · MIXED HTML CARE CONTROLS */
.mixed-care-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.care-module{
  border:1px solid var(--line,#2a3b45);border-radius:9px;padding:9px;
  background:rgba(255,255,255,.025);min-height:118px;
}
.care-title{font-weight:800;margin-bottom:7px}
.comfort-radar{
  position:relative;width:92px;height:92px;border-radius:50%;display:block;margin:0 auto 6px;
  border:1px solid var(--line,#2a3b45);background:radial-gradient(circle,rgba(115,199,230,.18),rgba(0,0,0,.12));
  overflow:hidden;color:inherit;
}
.radar-ring{position:absolute;border:1px solid rgba(115,199,230,.35);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.r1{width:28%;height:28%}.r2{width:55%;height:55%}.r3{width:82%;height:82%}
.radar-sweep{position:absolute;left:50%;top:50%;width:44%;height:2px;background:currentColor;transform-origin:left center;animation:vgSweep 3s linear infinite;opacity:.55}
.comfort-radar b{position:relative;z-index:2}
@keyframes vgSweep{to{transform:rotate(360deg)}}

.seg-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.seg-buttons button,.activity-console button{
  padding:8px 5px;border-radius:6px;border:1px solid var(--line,#2a3b45);
  background:rgba(255,255,255,.035);color:inherit;
}
.food-readout{text-align:center;font-size:1.15rem;font-weight:900;margin:8px 0}

.water-tank{position:relative;width:70px;height:95px;margin:0 auto 5px;display:block;overflow:hidden;border:1px solid var(--line,#2a3b45);border-radius:10px;background:rgba(0,0,0,.12);color:inherit}
.water-fill{position:absolute;left:0;right:0;bottom:0;background:rgba(115,199,230,.28)}
.water-tank b{position:relative;z-index:2}

.brush-track{position:relative;width:100%;height:48px;border:1px solid var(--line,#2a3b45);border-radius:8px;overflow:hidden;background:rgba(0,0,0,.12)}
.brush-progress{position:absolute;left:0;top:0;bottom:0;background:rgba(115,199,230,.16)}
.brush-icon{position:relative;font-size:1.5rem}

.play-pad{width:100%;min-height:70px;border-radius:12px;border:1px dashed var(--line,#2a3b45);background:rgba(255,255,255,.025);color:inherit;display:flex;align-items:center;justify-content:center;gap:10px}
.play-pad span{font-size:1.8rem}.play-pad b{font-size:1.1rem}

.activity-console{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:6px;align-items:center}
.activity-core{min-height:56px;font-weight:900}

.trust-ring{
  --trust:0deg;width:90px;height:90px;border-radius:50%;display:block;margin:0 auto 5px;border:0;
  background:conic-gradient(currentColor var(--trust),rgba(255,255,255,.08) 0);padding:7px;color:inherit;
}
.trust-ring span{width:100%;height:100%;border-radius:50%;background:var(--panel2,#172229);display:flex;flex-direction:column;align-items:center;justify-content:center}
.trust-ring small{font-size:.6rem;letter-spacing:.08em}

.status-bars{display:grid;gap:8px}
.status-bars div{display:grid;grid-template-columns:58px 1fr;gap:6px;align-items:center}
.status-bars progress{width:100%;height:12px}

@media(max-width:540px){.mixed-care-grid{grid-template-columns:1fr 1fr}}
@media(max-width:390px){.mixed-care-grid{grid-template-columns:1fr}}


/* VET GODS · REAL-TIME PET CLOCK */
.pet-time-box{
  display:flex;flex-direction:column;gap:2px;margin-top:8px;
  padding:7px 9px;border:1px solid var(--line,#2a3b45);
  border-radius:7px;background:rgba(255,255,255,.025);
}
.pet-time-box b{font-size:.78rem}
.pet-time-box span{font-size:.72rem;opacity:.78}


/* VET GODS · EXOTIC-FIRST ADMIT */
.vg-exotic-intake{margin-bottom:10px}
.vg-exotic-strip{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:8px;
}
.vg-exotic-pick{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  min-height:92px;padding:8px;border-radius:7px;
  border:1px solid var(--line,#2a3b45);
  background:var(--panel2,#172229);color:inherit;text-align:left;
}
.vg-exotic-pick b{font-size:.8rem}
.vg-exotic-pick span{font-size:.74rem;opacity:.9}
.vg-exotic-pick small{font-size:.66rem;opacity:.7}
.vg-exotic-pick em{font-style:normal;font-size:.64rem;font-weight:900;margin-top:auto;opacity:.85}
@media(max-width:640px){.vg-exotic-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* =========================================================
   VET GODS · BASE64 OUTER SPACE GODS WAR THEME
   ========================================================= */
.vg-space-masthead{
  position:relative;max-width:1180px;margin:8px auto 10px;padding:0 8px;
}
.vg-space-masthead img{
  display:block;width:100%;aspect-ratio:2.5/1;object-fit:cover;
  border-radius:14px;border:1px solid #2d4d67;background:#050812;
}
.vg-space-masthead-copy{
  position:absolute;left:24px;right:24px;bottom:20px;
  padding:8px 10px;border-radius:8px;
  background:rgba(3,8,18,.72);backdrop-filter:none;
  border:1px solid rgba(112,217,255,.25);
}
.vg-space-masthead-copy b{display:block;font-size:.95rem;letter-spacing:.08em}
.vg-space-masthead-copy span{display:block;font-size:.72rem;opacity:.82;margin-top:2px}
.vg-space-war-panel{
  display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;
  border-color:#34546b !important;
  background:linear-gradient(135deg,rgba(13,29,47,.96),rgba(21,18,42,.96)) !important;
}
.vg-space-war-panel img{
  width:100%;aspect-ratio:1.9/1;object-fit:contain;border-radius:8px;
}
.vg-space-war-panel h3{margin:0 0 5px}
.vg-god-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.vg-god-tags span{
  font-size:.61rem;font-weight:800;letter-spacing:.05em;padding:4px 6px;border-radius:5px;
  border:1px solid #315368;background:rgba(255,255,255,.025);
}
@media(max-width:560px){
  .vg-space-masthead-copy{left:16px;right:16px;bottom:14px}
  .vg-space-masthead-copy span{display:none}
  .vg-space-war-panel{grid-template-columns:1fr}
  .vg-space-war-panel img{max-height:115px}
}


/* =========================================================
   VET GODS · FRESH GRAPHIC SYSTEM
   ========================================================= */
:root{
  --vgfx-bg:#040812;
  --vgfx-panel:#0d1824;
  --vgfx-panel2:#122334;
  --vgfx-line:#29465b;
  --vgfx-cyan:#78dcff;
  --vgfx-red:#ff6d7e;
  --vgfx-gold:#ffd66f;
  --vgfx-green:#7be3b7;
}
html,body{background:#040812 !important}
body{
  background:
    radial-gradient(circle at 50% 0%,rgba(49,87,135,.18),transparent 42%),
    linear-gradient(#040812,#07101a) !important;
}
.vgfx-header{
  max-width:1180px;margin:7px auto;padding:7px 10px;
  display:grid;grid-template-columns:44px 1fr auto;gap:9px;align-items:center;
  border:1px solid #27465c;border-radius:10px;background:#09131e;
}
.vgfx-header img{width:44px;height:44px;border-radius:9px}
.vgfx-header b{display:block;font-size:.92rem;letter-spacing:.16em;color:#effbff}
.vgfx-header span{display:block;font-size:.58rem;letter-spacing:.13em;color:#87a7ba;margin-top:2px}
.vgfx-war{
  border:1px solid #7f3441;border-radius:6px;padding:6px 8px;
  font-size:.58rem;font-weight:900;letter-spacing:.08em;color:#ff9bab;background:#241018;
}
.vgfx-scene{
  position:relative;margin:0 0 10px;border:1px solid #2d526b;border-radius:12px;
  overflow:hidden;background:#050b12;box-shadow:0 8px 22px rgba(0,0,0,.24);
}
.vgfx-scene>img{
  display:block;width:100%;height:auto;aspect-ratio:14/5;object-fit:cover;
}
.vgfx-scene-overlay{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:flex-end;justify-content:space-between;gap:8px;
  padding:9px 11px;background:linear-gradient(transparent,rgba(3,8,14,.92));
}
.vgfx-scene-overlay b{display:block;color:white;font-size:.92rem;letter-spacing:.08em}
.vgfx-scene-overlay span{display:block;font-size:.63rem;color:#a7c2d2;margin-top:2px}
.vgfx-life{
  display:flex !important;align-items:center;gap:5px;padding:5px 7px;border-radius:5px;

/* VET GODS · EXPANDED RECOVERY PATHWAY */
.vg-recovery-phase{

}

.vg-recovery-phase span{font-size:.68rem;opacity:.75}


/* =========================================================
   VET GODS · MY PETS HOME SIM
   ========================================================= */
.pet-sim-room{
  margin:8px 0 10px;padding:9px;border:1px solid var(--vgfx-line,#29465b);
  border-radius:9px;background:linear-gradient(180deg,#0c1b28,#09151f);
}
.pet-sim-room-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;
}
.pet-sim-room-head b{display:block;font-size:.82rem}
.pet-sim-room-head span{display:block;font-size:.64rem;opacity:.7;margin-top:2px}
.pet-sim-activity{
  font-size:.62rem;font-weight:900;padding:5px 7px;border-radius:5px;
  border:1px solid #36586d;background:#102536;
}
.pet-sim-room-map{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:8px;
}
.pet-sim-room-map button{
  padding:7px 5px;border-radius:6px;border:1px solid #2d5064;
  background:#102332;color:inherit;font-size:.62rem;
}
.pet-sim-room-map button.active{
  border-color:#78dcff;box-shadow:inset 0 -2px #78dcff !important;
}

.pet-sim-stats>div{
  display:grid;grid-template-columns:72px 1fr;gap:6px;align-items:center;font-size:.62rem
}
.pet-sim-stats progress{width:100%;height:10px}
.pet-home-report .pet-report-row{

.pet-home-report .pet-report-row span{font-size:.68rem;opacity:.8}
@media(max-width:480px){
  .pet-sim-room-map{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pet-home-report .pet-report-row{grid-template-columns:78px 1fr}
}

.living-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.living-head h3{margin:0}
.habitat-world{position:relative;min-height:370px;border:1px solid #31566b;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(55,118,145,.16),transparent 34%),linear-gradient(180deg,#0b1b28,#07121b)}

.z-rest{left:3%;top:6%;width:28%;height:34%}.z-feed{right:3%;top:6%;width:25%;height:29%}.z-water{right:3%;bottom:5%;width:25%;height:30%}.z-activity{left:35%;top:5%;width:28%;height:39%}.z-social{left:34%;bottom:5%;width:30%;height:34%}.z-medical{left:3%;bottom:5%;width:25%;height:29%}

 .sanctuary-toolbar{flex-direction:column}.sanctuary-actions{justify-content:flex-start}

const NAMES=["Koda","Vesper 2","Bella","Ember","Atlas","Milo","Nova","Rune","Willow","Sable","Piper","Halo","Storm","Iris","June","Vale","Echo","Nyx","Mira","Dawn","Orion","Ghost","Skye","River"];
const SPECIES=["Dog","Cat","Rabbit","Fox"];
const CONDITIONS=["Fracture","Respiratory Crisis","Deep Wound","Foreign Body","Infection","Toxin Exposure","Eye Trauma","Heat Emergency"];

const state={
  care:0,mercy:300,saved:0,screen:"clinic",nextCase:1,patients:[],pets:[],log:[]
};

const TRAUMA_TRAITS=[
  "Waits by the door because someone once never came back.",
  "Guards food after going hungry for too long.",
  "Startles when keys jingle near the doorway.",
  "Sleeps facing the exit so nothing can surprise them.",
  "Needs someone nearby before finishing a meal.",
  "Hides when a room suddenly gets quiet.",
  "Carries one old blanket everywhere.",
  "Checks the food bowl even when it is full.",
  "Whimpers when left alone for too long.",
  "Freezes when a leash first comes out."
];

function ensurePetSim(p){
  if(!p.sim){
    const seed=(p.name||"pet").split("").reduce((a,c)=>a+c.charCodeAt(0),0);
    p.sim={
      hunger:65,water:68,comfort:58,cleanliness:72,pain:Math.max(5,p.pain||12),
      energy:62,trust:28,loneliness:48,fear:55,happiness:42,
      day:1,
      trauma:TRAUMA_TRAITS[seed%TRAUMA_TRAITS.length],
      personality:["Shy","Clingy","Playful","Gentle","Curious","Protective","Sleepy","Mischievous"][seed%8],
      memories:["Came home from the hospital"],
      friendships:{},
      bedtime:false,
      medicineDue:(p.condition||"").match(/Fracture|Wound|Infection|Eye|Respiratory/i)?true:false
    };
  }
  return p.sim;
}
function clampPet(v){return Math.max(0,Math.min(100,Math.round(v)))}

function badNeedFill(v){
  return Math.max(0,Math.min(100,Number(v)||0));
}
function petTrustStage(v){
  if(v<20)return "Still afraid";
  if(v<40)return "Tolerates your presence";
  if(v<60)return "Starting to trust you";
  if(v<80)return "Feels safe with you";
  if(v<100)return "Deeply bonded";
  return "I KNOW I'M HOME";
}
function addMemory(p,text){
  const s=ensurePetSim(p);
  if(!s.memories.includes(text))s.memories.unshift(text);
  s.memories=s.memories.slice(0,12);
}
function petAction(id,action){
  const p=state.pets.find(x=>x.id===id); if(!p)return;
  const s=ensurePetSim(p);
  const before=s.trust;
  if(action==="feed"){s.hunger+=26;s.happiness+=4;if(s.fear>60)s.hunger+=4;addMemory(p,"Shared a meal at home")}
  if(action==="water"){s.water+=30;s.comfort+=3}
  if(action==="brush"){s.cleanliness+=20;s.comfort+=8;s.trust+=4}
  if(action==="medicine"){s.pain-=22;s.medicineDue=false;s.trust+=2;addMemory(p,"Took medicine without hiding")}
  if(action==="play"){s.energy-=14;s.happiness+=24;s.loneliness-=14;s.trust+=6;addMemory(p,"Played without watching the door")}
  if(action==="walk"){s.energy-=12;s.happiness+=18;s.fear-=10;s.trust+=5;addMemory(p,"First safe walk")}
  if(action==="hold"){s.comfort+=18;s.loneliness-=16;s.fear-=8;s.trust+=7;addMemory(p,"Let you hold them")}
  if(action==="talk"){s.comfort+=10;s.loneliness-=12;s.fear-=6;s.trust+=5}
  if(action==="sleep"){s.energy+=30;s.comfort+=12;s.fear-=5;s.bedtime=true;addMemory(p,"Slept peacefully through the night")}
  if(action==="sit"){s.loneliness-=22;s.fear-=14;s.trust+=8;s.happiness+=6;addMemory(p,"You stayed when they were scared")}
  if(action==="bath"){s.cleanliness+=32;s.comfort-=4;s.trust+=2}
  if(action==="treat"){s.pain-=15;s.comfort+=10;s.trust+=3}
  for(const k of ["hunger","water","comfort","cleanliness","pain","energy","trust","loneliness","fear","happiness"])s[k]=clampPet(s[k]);
  if(before<100 && s.trust===100)addMemory(p,"I KNOW I'M HOME");
  state.mercy+=2;
  addLog(p.name+" · "+action+" at home");
  render();
}
function careForAllPets(){
  state.pets.forEach(p=>{
    const s=ensurePetSim(p);
    s.hunger=clampPet(s.hunger+20);s.water=clampPet(s.water+20);
    s.cleanliness=clampPet(s.cleanliness+10);s.comfort=clampPet(s.comfort+8);
    s.loneliness=clampPet(s.loneliness-6);
  });
  addLog("Basic care completed for all pets");
  render();
}
function nextPetDay(){
  state.pets.forEach(p=>{
    const s=ensurePetSim(p);
    s.day++;
    s.hunger=clampPet(s.hunger-12);
    s.water=clampPet(s.water-15);
    s.cleanliness=clampPet(s.cleanliness-8);
    s.energy=clampPet(s.energy-5);
    s.loneliness=clampPet(s.loneliness+9);
    s.fear=clampPet(s.fear+(s.loneliness>65?6:-2));
    s.happiness=clampPet(s.happiness-6);
    if(s.medicineDue)s.pain=clampPet(s.pain+8);
    s.bedtime=false;
  });
  addLog("A new day begins in My Pets");
  render();
}
function petTodayText(p){
  const s=ensurePetSim(p);
  const lines=[];
  if(s.hunger<40)lines.push(p.name+" did not finish breakfast and keeps checking the bowl.");
  else if(s.hunger<65)lines.push(p.name+" is getting hungry.");
  if(s.loneliness>65)lines.push("They keep looking toward the doorway when you leave.");
  if(s.fear>65)lines.push("A small sound made them freeze for a moment.");
  if(s.pain>35)lines.push("Their old injury seems to be bothering them today.");
  if(s.trust>75)lines.push("They followed you from room to room this morning.");
  if(s.happiness>75)lines.push("They brought a toy over on their own.");
  if(!lines.length)lines.push("Today feels quiet. "+p.name+" seems comfortable and safe.");
  return lines.slice(0,4);
}
function petNeed(label,value,badState=false){
  const v=Math.max(0,Math.min(100,Number(value)||0));
  const fill=v;
  const stateText=badState
    ? (v<=10?"None":v<=30?"Low":v<=60?"Moderate":"High")
    : (v>=80?"Great":v>=55?"Okay":v>=30?"Low":"Critical");
  return `<div class="need">
    <div class="need-head"><span>${label}</span><span>${Math.round(v)} · ${stateText}</span></div>
    <div class="needbar"><i style="width:${fill}%"></i></div>
  </div>`;
}
function petSimHTML(p){
  const s=ensurePetSim(p);
  return `<div class="pet-sim">
    <div class="pet-top">
      <img src="${p.image}" alt="${p.name}">
      <div>
        <h3>${p.name}</h3>
        <div class="small">${p.species} · ${s.personality} · Day ${s.day} home</div>
        <div class="trust-stage">${petTrustStage(s.trust)}</div>
        <div class="today-box">${petTodayText(p).map(x=>`<div>${x}</div>`).join("")}</div>
        <div class="pet-alert">${s.trauma}</div>
      </div>
    </div>
    <div class="pet-needs">
      ${petNeed("Hunger",s.hunger)}
      ${petNeed("Water",s.water)}
      ${petNeed("Comfort",s.comfort)}
      ${petNeed("Cleanliness",s.cleanliness)}
      ${petNeed("Energy",s.energy)}
      ${petNeed("Trust",s.trust)}
      ${petNeed("Loneliness",s.loneliness,true)}
      ${petNeed("Fear",s.fear,true)}
      ${petNeed("Happiness",s.happiness)}
      ${petNeed("Pain",s.pain,true)}
    </div>
    <div class="pet-actions">
      <button onclick="petAction('${p.id}','feed')">Offer Food</button>
      <button onclick="petAction('${p.id}','water')">Fresh Water</button>
      <button onclick="petAction('${p.id}','sit')">Sit With Them</button>
      <button onclick="petAction('${p.id}','play')">Play</button>
      <button onclick="petAction('${p.id}','walk')">Short Walk</button>
      <button onclick="petAction('${p.id}','talk')">Talk Softly</button>
      <button onclick="petAction('${p.id}','hold')">Hold / Comfort</button>
      <button onclick="petAction('${p.id}','brush')">Brush</button>
      <button onclick="petAction('${p.id}','bath')">Clean Up</button>
      <button onclick="petAction('${p.id}','medicine')">${s.medicineDue?"Give Medicine":"Check Medicine"}</button>
      <button onclick="petAction('${p.id}','treat')">Home Treatment</button>
      <button onclick="petAction('${p.id}','sleep')">Bedtime</button><button onclick="sendSanctuary('${p.id}')">Move to Sanctuary</button>
    </div>
    <div class="memory-list">
      <b>Memories</b>
      ${s.memories.slice(0,5).map(x=>`<div class="memory">${x}</div>`).join("")}
    </div>
  </div>`;
}


function makePatient(index){
  const i=index%NAMES.length;
  return {
    id:"P"+Date.now()+"_"+index,
    name:NAMES[i],
    species:SPECIES[i%SPECIES.length],
    condition:CONDITIONS[i%CONDITIONS.length],
    image:THUMBS[i%THUMBS.length],
    department:"Clinic",
    admitted:true,
    pain:35+(i*7)%45,
    stress:30+(i*5)%50,
    oxygen:72+(i*3)%25,
    bleeding:(i*9)%55,
    infection:(i*11)%50,
    shock:(i*6)%48,
    surgeryRequired:["Fracture","Deep Wound","Foreign Body","Eye Trauma"].includes(CONDITIONS[i%CONDITIONS.length]),
    surgeryStep:0,
    recoveryStep:0
  };
}

function addLog(msg){
  state.log.unshift(new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+" · "+msg);
  state.log=state.log.slice(0,50);
}
function admitted(){return state.patients.filter(p=>p.admitted)}
function dept(name){return admitted().filter(p=>p.department===name)}
function active(){return state.patients.find(p=>p.id===state.activeId)||admitted()[0]||null}
function setActive(id){state.activeId=id;render()}
function route(p,where){
  p.department=where;
  state.activeId=p.id;
  state.screen=where.toLowerCase();
  addLog(p.name+" transferred to "+where);
  render();
}
function discharge(p){
  p.admitted=false;p.department="Home";state.saved++;state.credits+=125;
  const homePet={...p}; ensurePetSim(homePet); state.pets.push(homePet);
  lifeBookRecord(homePet,"HOME ❤️"); EXP.lifeSparks+=5; EXP.xp+=12; expProgress(); addLog(p.name+" discharged successfully");
  state.screen="clinic";state.activeId=dept("Clinic")[0]?.id||null;render();
}
function severity(p){
  return Math.max(p.pain,p.stress,100-p.oxygen,p.bleeding,p.infection,p.shock)
}
function treat(p,amount){
  const before=severity(p);
  p.pain=Math.max(0,p.pain-amount);
  p.stress=Math.max(0,p.stress-Math.round(amount*.8));
  p.oxygen=Math.min(100,p.oxygen+Math.round(amount*.7));
  p.bleeding=Math.max(0,p.bleeding-amount);
  p.infection=Math.max(0,p.infection-Math.round(amount*.6));
  p.shock=Math.max(0,p.shock-Math.round(amount*.7));
  state.credits=Math.max(0,state.credits-amount);
  state.mercy+=Math.ceil(amount/8);
  addLog(p.name+" improved from "+before+" to "+severity(p));
  if(severity(p)<22){
    if(p.surgeryRequired) route(p,"Surgery");
    else route(p,"Recovery");
  }else render();
}

/* =========================================================
   VET GODS · REAL-TIME MY PETS DECAY
   Needs change according to actual elapsed wall-clock hours.
   The timestamp lives inside saved state, so closing/reopening
   the HTML does not reset the clock.
   ========================================================= */
const PET_DECAY = {
  intervalMs: 60*60*1000,   // one real hour
  maxCatchupHours: 72,      // prevents extreme damage after long absences
  perHour:{
    hunger:-3.0,            // "fed" meter drops
    water:-4.0,
    comfort:-2.0,
    happiness:-2.2,
    cleanliness:-1.2,
    energy:-1.5,
    trust:-0.35
  }
};

function clampPetStat(v){ return Math.max(0,Math.min(100,Number(v)||0)); }

function applyPetHourlyDecay(p,hours){
  ensurePet(p);
  const d=PET_DECAY.perHour;
  p.hunger=clampPetStat(p.hunger+d.hunger*hours);
  p.water=clampPetStat(p.water+d.water*hours);
  p.comfort=clampPetStat(p.comfort+d.comfort*hours);
  p.happiness=clampPetStat(p.happiness+d.happiness*hours);
  p.cleanliness=clampPetStat(p.cleanliness+d.cleanliness*hours);
  p.energy=clampPetStat(p.energy+d.energy*hours);
  p.trust=clampPetStat(p.trust+d.trust*hours);

  // Consequences become stronger only when needs are genuinely neglected.
  let neglect=0;
  if(p.hunger<35) neglect+=1;
  if(p.water<35) neglect+=1.25;
  if(p.comfort<35) neglect+=0.8;
  if(p.happiness<30) neglect+=0.65;
  if(p.cleanliness<25) neglect+=0.45;

  if(neglect>0){
    p.loneliness=clampPetStat((p.loneliness||0)+(0.7*neglect*hours));
    p.fear=clampPetStat((p.fear||0)+(0.35*neglect*hours));
    if(p.water<20 || p.hunger<20){
      p.pain=clampPetStat((p.pain||0)+(0.18*neglect*hours));
    }
  }else{
    // Well-cared-for animals very slowly settle while you're away.
    p.fear=clampPetStat((p.fear||0)-(0.15*hours));
  }
}

function updateRealTimePetDecay(){
  if(!state || !Array.isArray(state.pets))return 0;
  const now=Date.now();

  if(!state.lastPetDecayAt){
    state.lastPetDecayAt=now;
    return 0;
  }

  const elapsed=Math.max(0,now-state.lastPetDecayAt);
  const wholeHours=Math.floor(elapsed/PET_DECAY.intervalMs);
  if(wholeHours<1)return 0;

  const appliedHours=Math.min(wholeHours,PET_DECAY.maxCatchupHours);
  state.pets.forEach(p=>applyPetHourlyDecay(p,appliedHours));

  // Preserve leftover partial hour instead of resetting it.
  state.lastPetDecayAt += wholeHours*PET_DECAY.intervalMs;
  state.lastPetDecayHours=appliedHours;

  if(typeof saveGame==="function"){
    try{saveGame("Hourly pet needs update",true)}catch(e){}
  }
  return appliedHours;
}

function petDecayStatusHTML(){
  const last=state.lastPetDecayAt ? new Date(state.lastPetDecayAt) : new Date();
  return `<div class="pet-time-box">
    <b>⏱ Real-Time Care</b>

}

   Autonomous behavior + real-time/offline simulation.
   ========================================================= */

const PET_SIM = {
  stepMs: 60*60*1000,          // one real hour per sim step
  maxCatchupHours: 72,
  dayparts:["Morning","Afternoon","Evening","Night"]
};

function ensurePetSim(p){
  ensurePet(p);
  if(!p.sim){
    p.sim={
      room:"Rest Area",
      activity:"Settling in",
      lastActivityAt:Date.now(),
      simHours:0,
      day:1,
      daypartIndex:0,
      favoriteToy:null,
      favoriteRoom:null,
      bondedPetId:null,
      rivalPetId:null,
      training:0,
      habitatQuality:70,
      habitatTemp:70,
      habitatHumidity:55,
      enrichment:60,
      sleep:65,
      routine:50,
      eventLog:[],
      likes:{},
      dislikes:{}
    };
  }
  if(!Array.isArray(p.sim.eventLog))p.sim.eventLog=[];
  if(p.sim.habitatQuality==null)p.sim.habitatQuality=70;
  if(p.sim.enrichment==null)p.sim.enrichment=60;
  if(p.sim.sleep==null)p.sim.sleep=65;
  if(p.sim.routine==null)p.sim.routine=50;
  return p.sim;
}

function petSpeciesMode(p){
  const g=(typeof VG_SPECIES_GROUP!=="undefined" && VG_SPECIES_GROUP[p.species]) || "";
  if(["arachnid","insect","myriapod","mollusk","crustacean","amphibian","reptile","colony"].includes(g))return g;
  if(["Dog","Goat","Sheep","Pig","Mini Horse"].includes(p.species))return "active";
  if(["Cat","Ferret","Rabbit","Guinea Pig","Hamster","Chinchilla","Rat","Mouse"].includes(p.species))return "smallpet";
  if(["Parrot","Cockatiel","Chicken","Duck"].includes(p.species))return "bird";
  return "companion";
}

function petRoomsFor(p){
  const mode=petSpeciesMode(p);
  const rooms={
    active:["Rest Area","Feeding Station","Outdoor Yard","Training Area","Social Room","Medical Corner"],
    smallpet:["Rest Area","Feeding Station","Play Area","Hide Area","Social Room","Medical Corner"],
    bird:["Perch Room","Feeding Station","Flight / Enrichment Area","Quiet Rest","Social Room","Medical Corner"],
    arachnid:["Terrarium","Hide","Water Station","Observation Area","Molt Zone"],
    insect:["Tall Terrarium","Feeding Area","Climbing Zone","Molt Zone","Observation Area"],
    myriapod:["Deep Substrate","Hide","Feeding Area","Moist Zone","Observation Area"],
    mollusk:["Humid Habitat","Feeding Area","Calcium Station","Hide","Observation Area"],
    crustacean:["Habitat","Fresh Water","Saltwater / Mineral Area","Shell Area","Hide"],
    amphibian:["Vivarium","Water Area","Hide","Feeding Zone","Quiet Zone"],
    reptile:["Warm Side","Cool Side","Hide","Feeding Zone","Basking / Light Area"],
    colony:["Nest Chambers","Foraging Area","Hydration Zone","Brood Area","Dark Rest Zone"],
    companion:["Rest Area","Feeding Station","Play Area","Social Room","Medical Corner"]
  };
  return rooms[mode]||rooms.companion;
}

function petActivityPool(p){
  const mode=petSpeciesMode(p);
  const pools={
    active:["Sleeping","Eating","Drinking","Walking","Sniffing around","Playing","Training","Watching the door","Resting near you"],
    smallpet:["Sleeping","Eating","Drinking","Hiding","Exploring","Grooming","Playing","Watching quietly","Nesting"],
    bird:["Perching","Eating","Drinking","Preening","Calling softly","Exploring perch","Resting","Watching room"],
    arachnid:["Hiding","Resting","Webbing","Exploring enclosure","Drinking","Watching movement","Pre-molt stillness"],
    insect:["Climbing","Resting","Feeding","Exploring","Hanging for molt","Cleaning antennae"],
    myriapod:["Burrowing","Resting","Feeding","Exploring substrate","Seeking moisture"],
    mollusk:["Resting","Feeding","Exploring wall","Seeking moisture","Hiding"],
    crustacean:["Climbing","Burrowing","Exploring shells","Feeding","Resting","Drinking"],
    amphibian:["Hiding","Soaking","Resting","Feeding","Exploring at night","Watching movement"],
    reptile:["Basking","Hiding","Resting","Exploring","Feeding","Thermoregulating"],
    colony:["Foraging","Tending brood","Moving food","Resting in nest","Exploring outworld","Hydrating nest"],
    companion:["Sleeping","Eating","Drinking","Playing","Exploring","Resting near you"]
  };
  return pools[mode]||pools.companion;
}

function petChoose(arr,seed){
  if(!arr.length)return "";
  const n=Math.abs(Math.floor(seed))%arr.length;
  return arr[n];
}

function petSimLog(p,msg){
  const s=ensurePetSim(p);
  s.eventLog.unshift({t:Date.now(),msg});
  if(s.eventLog.length>24)s.eventLog.length=24;
  if(p.memories && !p.memories.includes(msg) && /first|favorite|bond|slept peacefully|came when called/i.test(msg)){
    p.memories.push(msg);
  }
}

function petSimStep(p,hourIndex){
  const s=ensurePetSim(p);
  const seed=(p.id||p.name||"pet").split("").reduce((a,c)=>a+c.charCodeAt(0),0)+s.simHours*17+hourIndex*31;
  const rooms=petRoomsFor(p);
  const acts=petActivityPool(p);

  // Basic autonomous choice influenced by need state.
  let activity;
  if((p.hunger||0)<35) activity="Eating";
  else if((p.water||0)<35) activity="Drinking";
  else if((p.energy||0)<28 || s.sleep<30) activity="Sleeping";
  else if((p.loneliness||0)>60 && !["arachnid","insect","myriapod","mollusk","colony"].includes(petSpeciesMode(p))) activity="Seeking company";
  else activity=petChoose(acts,seed);

  s.activity=activity;
  s.room=petChoose(rooms,seed*1.7);
  s.lastActivityAt=Date.now();
  s.simHours++;

  // Daypart / day progression
  s.daypartIndex=(s.daypartIndex+1)%PET_SIM.dayparts.length;
  if(s.daypartIndex===0)s.day++;

  // Autonomous behaviors have small effects.
  if(activity==="Eating"){
    p.hunger=Math.min(100,(p.hunger||50)+8);
    p.happiness=Math.min(100,(p.happiness||50)+2);
  }
  if(activity==="Drinking"){
    p.water=Math.min(100,(p.water||50)+10);
  }
  if(activity==="Sleeping" || /Resting|Quiet|Hiding|Pre-molt/.test(activity)){
    s.sleep=Math.min(100,s.sleep+8);
    p.energy=Math.min(100,(p.energy||50)+5);
    p.fear=Math.max(0,(p.fear||0)-1);
  }else{
    s.sleep=Math.max(0,s.sleep-2);
  }
  if(/Playing|Exploring|Walking|Climbing|Foraging|Training|Preening|Grooming/.test(activity)){
    s.enrichment=Math.min(100,s.enrichment+4);
    p.happiness=Math.min(100,(p.happiness||50)+2);
    p.energy=Math.max(0,(p.energy||50)-2);
  }else{
    s.enrichment=Math.max(0,s.enrichment-1);
  }

  // Habitat quality gradually matters for exotics.
  const mode=petSpeciesMode(p);
  if(["arachnid","insect","myriapod","mollusk","crustacean","amphibian","reptile","colony"].includes(mode)){
    if(s.habitatQuality<40){
      p.fear=Math.min(100,(p.fear||0)+1.5);
      p.happiness=Math.max(0,(p.happiness||50)-1.5);
    }
  }

  // Occasional events.
  if(s.simHours%6===0){
    const events=[
      `${p.name} settled into ${s.room}.`,
      `${p.name} spent time ${activity.toLowerCase()}.`,
      `${p.name} found a comfortable routine.`,
      `${p.name} watched the room and relaxed.`,
      `${p.name} had a quiet hour in ${s.room}.`
    ];
    petSimLog(p,petChoose(events,seed*2.1));
  }

  // Rare relationship event for social pets.
  if(state.pets.length>1 && s.simHours%12===0 && !["arachnid","insect","myriapod","mollusk","colony"].includes(mode)){
    const others=state.pets.filter(x=>x.id!==p.id);
    if(others.length){
      const other=petChoose(others,seed*3.3);
      if(other){
        s.bondedPetId=other.id;
        p.trust=Math.min(100,(p.trust||0)+2);
        p.loneliness=Math.max(0,(p.loneliness||0)-4);
        petSimLog(p,`${p.name} spent quiet time with ${other.name}.`);
      }
    }
  }
  if(typeof petMindSimTick==='function')petMindSimTick(p);
}


function updatePetHomeSim(){
  if(!state || !Array.isArray(state.pets))return 0;
  const now=Date.now();
  if(!state.lastPetSimAt){
    state.lastPetSimAt=now;
    state.pets.forEach(ensurePetSim);
    return 0;
  }
  const elapsed=Math.max(0,now-state.lastPetSimAt);
  const hours=Math.floor(elapsed/PET_SIM.stepMs);
  if(hours<1)return 0;

  const apply=Math.min(hours,PET_SIM.maxCatchupHours);
  state.pets.forEach(p=>{
    ensurePetSim(p);
    for(let i=0;i<apply;i++)petSimStep(p,i);
  });
  state.lastPetSimAt += hours*PET_SIM.stepMs;
  state.lastPetSimCatchup=apply;
  if(typeof saveGame==="function"){
    try{saveGame("My Pets home simulation",true)}catch(e){}
  }
  return apply;
}

   VET GODS · INDIVIDUAL PET MEMORY / PERSONALITY EVOLUTION
   ========================================================= */

function ensurePetMind(p){
  ensurePetSim(p);
  if(!p.mind){
    p.mind={
      traits:{
        confidence:Math.max(10,Math.min(90,45+(p.trust||0)*0.2-(p.fear||0)*0.15)),
        curiosity:45,
        sociability:50,
        independence:45,
        resilience:50
      },
      likes:[],
      dislikes:[],
      learned:[],
      associations:{},
      requests:[],
      milestones:[],
      bondPlayer:Math.max(0,Math.min(100,p.trust||0)),
      bondPets:{},
      behaviorState:"settling",
      favoriteFood:null,
      favoriteToy:null,
      favoriteRoom:null,
      favoriteCompanion:null,
      avoids:null,
      lastMindEvent:0
    };
  }
  const m=p.mind;
  for(const k of ["likes","dislikes","learned","requests","milestones"]) if(!Array.isArray(m[k]))m[k]=[];
  if(!m.associations)m.associations={};
  if(!m.bondPets)m.bondPets={};
  return m;
}

function petMindClamp(v){return Math.max(0,Math.min(100,Number(v)||0));}
function petMindAddUnique(arr,text){if(text && !arr.includes(text))arr.push(text);}

function petAssociation(p,key,delta,label){
  const m=ensurePetMind(p);
  m.associations[key]=petMindClamp((m.associations[key]||50)+delta);
  if(label && delta>=5)petMindAddUnique(m.learned,label);
}

function petDiscoverPreference(p,type,value,positive=true){
  const m=ensurePetMind(p);
  if(!value)return;
  const target=positive?m.likes:m.dislikes;
  const text=`${type}: ${value}`;
  petMindAddUnique(target,text);
  if(positive){
    if(type==="Food")m.favoriteFood=value;
    if(type==="Toy")m.favoriteToy=value;
    if(type==="Room")m.favoriteRoom=value;
    if(type==="Companion")m.favoriteCompanion=value;
  }else if(type==="Avoids"){
    m.avoids=value;
  }
}

function petMilestone(p,key,text){
  const m=ensurePetMind(p);
  if(m.milestones.includes(key))return;
  m.milestones.push(key);
  petMindAddUnique(p.memories||(p.memories=[]),text);
  petSimLog(p,text);
}

function evolvePetPersonality(p){
  const m=ensurePetMind(p),t=m.traits;
  const trust=p.trust||0, fear=p.fear||0, happy=p.happiness||0;
  t.confidence=petMindClamp(t.confidence + (trust>65?0.7:0) - (fear>60?0.5:0));
  t.curiosity=petMindClamp(t.curiosity + ((happy>65 && fear<40)?0.35:0));
  t.sociability=petMindClamp(t.sociability + ((p.loneliness||0)<35?0.18:0));
  t.resilience=petMindClamp(t.resilience + ((p.pain||0)<30 && trust>55?0.15:0));
  m.bondPlayer=petMindClamp((m.bondPlayer*0.8)+(trust*0.2));

  if(t.confidence<30)m.behaviorState="frightened";
  else if(t.confidence<45)m.behaviorState="cautious";
  else if(t.curiosity>65)m.behaviorState="curious";
  else if(m.bondPlayer>80)m.behaviorState="bonded";
  else m.behaviorState="settling";

  if(m.bondPlayer>=90)petMilestone(p,"deep_bond",`${p.name} became deeply bonded with you.`);
  if((p.happiness||0)>=85)petMilestone(p,"very_happy",`${p.name} learned that home can be a happy place.`);
  if((p.fear||0)<=15)petMilestone(p,"fear_low",`${p.name} relaxed without watching every doorway.`);
}

function petMemoryInfluence(p){
  const m=ensurePetMind(p),s=ensurePetSim(p);
  // Learned favorites guide autonomous room/activity choices.
  if(m.favoriteRoom && Math.random()<0.18)s.room=m.favoriteRoom;
  if(m.favoriteCompanion && Math.random()<0.12){
    const o=state.pets.find(x=>x.name===m.favoriteCompanion);
    if(o)s.bondedPetId=o.id;
  }
  if(m.associations["leash"]>=70 && petSpeciesMode(p)==="active" && Math.random()<0.15){
    s.activity="Waiting for a safe walk";
  }
  if(m.associations["quiet_room"]>=70 && (p.fear||0)>45){
    s.room="Rest Area";
    s.activity="Seeking the quiet room";
  }
}

function petMindAfterCare(p,action){
  const m=ensurePetMind(p);
  const s=ensurePetSim(p);
  const a=(action||"").toLowerCase();

  if(/food|meal|snack/.test(a)){
    petAssociation(p,"feeding",2,"Food station means something good is coming.");
    if(!m.favoriteFood && Math.random()<0.16)petDiscoverPreference(p,"Food","Favorite meal",true);
  }
  if(/water|hydrate/.test(a))petAssociation(p,"water_station",2,"The water station is safe.");
  if(/walk|activity/.test(a)){
    petAssociation(p,"leash",3,"The leash means we come home again.");
    m.traits.confidence=petMindClamp(m.traits.confidence+1);
  }
  if(/comfort|nearby|sit|trust/.test(a)){
    m.bondPlayer=petMindClamp(m.bondPlayer+2.5);
    petAssociation(p,"quiet_room",2,"Quiet company feels safe.");
  }
  if(/play|enrich/.test(a)){
    m.traits.curiosity=petMindClamp(m.traits.curiosity+1.4);
    if(!m.favoriteToy && Math.random()<0.16)petDiscoverPreference(p,"Toy","Favorite enrichment toy",true);
  }
  if(/brush|groom|clean/.test(a)){
    petAssociation(p,"grooming",1.5,"Grooming can be gentle.");
  }
  if(s.room && Math.random()<0.08 && !m.favoriteRoom){
    petDiscoverPreference(p,"Room",s.room,true);
    petMilestone(p,"favorite_room",`${p.name} chose ${s.room} as a favorite place.`);
  }
  evolvePetPersonality(p);
}

function petBehaviorRequest(p){
  const m=ensurePetMind(p);
  const s=ensurePetSim(p);
  let text="";
  if((p.hunger||0)<35)text=`${p.name} keeps checking the feeding station.`;
  else if((p.water||0)<35)text=`${p.name} is lingering near the water area.`;
  else if((p.energy||0)<30)text=`${p.name} keeps returning to a quiet resting place.`;
  else if((p.loneliness||0)>60 && !["arachnid","insect","myriapod","mollusk","colony"].includes(petSpeciesMode(p)))text=`${p.name} keeps looking for company.`;
  else if((p.fear||0)>55)text=`${p.name} keeps watching the doorway and choosing sheltered spaces.`;
  else if(m.traits.curiosity>65)text=`${p.name} is investigating everything in ${s.room}.`;
  else text=`${p.name} seems comfortable with today's routine.`;

  if(!m.requests.length || m.requests[0]!==text){
    m.requests.unshift(text);
    m.requests=m.requests.slice(0,6);
  }
  return text;
}

function petBondEvent(p,other,amount=2){
  if(!other)return;
  const m=ensurePetMind(p),om=ensurePetMind(other);
  m.bondPets[other.id]=petMindClamp((m.bondPets[other.id]||25)+amount);
  om.bondPets[p.id]=petMindClamp((om.bondPets[p.id]||25)+amount);
  if(m.bondPets[other.id]>=70){
    m.favoriteCompanion=other.name;
    petDiscoverPreference(p,"Companion",other.name,true);
    petMilestone(p,`bond_${other.id}`,`${p.name} formed a strong bond with ${other.name}.`);
  }
}

function petMindSimTick(p){
  const m=ensurePetMind(p);
  petMemoryInfluence(p);
  evolvePetPersonality(p);

  const s=ensurePetSim(p);
  if(s.bondedPetId){
    const other=state.pets.find(x=>x.id===s.bondedPetId);
    if(other)petBondEvent(p,other,0.35);
  }

  // Discover preferences gradually from repeated life.
  if(s.simHours>0 && s.simHours%18===0 && !m.favoriteRoom)petDiscoverPreference(p,"Room",s.room,true);
  if(s.simHours>0 && s.simHours%24===0)petBehaviorRequest(p);
}

             onpointerdown="sanctuaryBeginDrag(event,'${o.id}')">

            <text text-anchor="middle" y="-2" class="obj-icon">${sanctuaryObjectIcon(o.type)}</text>

          </g>`).join("")}
      </svg>
      <div class="sanctuary-hud">

  </div>`;
}
function sanctuaryEnsureMotion(p,i){
  const s=ensurePetSim(p);
  if(!s.motion){
    const pos=petWorldPos(p,i);
    s.motion={x:pos.x/100,y:pos.y/100,tx:pos.x/100,ty:pos.y/100,vx:0,vy:0};
  }
  return s.motion;
}
function sanctuaryTargetFor(p,i){
  const s=ensurePetSim(p),m=ensurePetMind(p),mot=sanctuaryEnsureMotion(p,i);
  let target=null;
  if((p.hunger||0)<35)target=SANCTUARY_SIM.objects.find(o=>o.type==="food");
  else if((p.water||0)<35)target=SANCTUARY_SIM.objects.find(o=>o.type==="water");
  else if((p.energy||0)<30 || (s.sleep||0)<35)target=SANCTUARY_SIM.objects.find(o=>o.type==="bed")||SANCTUARY_SIM.objects.find(o=>o.type==="hide");
  else if((p.fear||0)>55)target=SANCTUARY_SIM.objects.find(o=>o.type==="hide");
  else if((s.enrichment||0)<45)target=SANCTUARY_SIM.objects.find(o=>o.type==="toy");
  else if(m.favoriteRoom && Math.random()<.1){
    target=SANCTUARY_SIM.objects[Math.floor(Math.random()*SANCTUARY_SIM.objects.length)];
  }
  if(!target && (Math.random()<.02 || Math.hypot(mot.tx-mot.x,mot.ty-mot.y)<.03)){
    target=SANCTUARY_SIM.objects[Math.floor(Math.random()*SANCTUARY_SIM.objects.length)];
  }
  if(target){
    mot.tx=Math.max(.05,Math.min(.95,target.x+(Math.random()-.5)*.08));
    mot.ty=Math.max(.08,Math.min(.92,target.y+(Math.random()-.5)*.08));
  }
}
function sanctuaryDraw(){
  const c=document.getElementById("sanctuaryCanvas");
  if(!c)return;
  const ctx=c.getContext("2d"),w=c.width,h=c.height;
  ctx.clearRect(0,0,w,h);
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#0c1c2b"); g.addColorStop(1,"#071018");
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  ctx.fillStyle=sanctuaryLight(); ctx.fillRect(0,0,w,h);

  // room grid / paths
  ctx.strokeStyle="rgba(130,210,255,.08)"; ctx.lineWidth=1;
  for(let x=0;x<w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}

  state.pets.slice(0,24).forEach((p,i)=>{
    const s=ensurePetSim(p),mot=sanctuaryEnsureMotion(p,i);
    sanctuaryTargetFor(p,i);
    const speed=SANCTUARY_SIM.perf==="full"?.0026:.0017;
    mot.x += (mot.tx-mot.x)*speed*16;
    mot.y += (mot.ty-mot.y)*speed*16;
    const x=mot.x*w,y=mot.y*h;
    ctx.save();
    ctx.shadowBlur=SANCTUARY_SIM.perf==="full"?14:0;
    ctx.shadowColor="rgba(100,220,255,.35)";
    ctx.fillStyle="#102b3d";
    ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.font="24px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(petWorldIcon(p),x,y-2);
    ctx.fillStyle="#e9f8ff";ctx.font="bold 12px system-ui";ctx.fillText(p.name,x,y+33);
    ctx.fillStyle="rgba(220,245,255,.72)";ctx.font="10px system-ui";ctx.fillText(s.activity||"Resting",x,y+46);
    ctx.restore();
  });
}
function sanctuaryLoop(ts){
  if(!SANCTUARY_SIM.running)return;
  if(SANCTUARY_SIM.lastFrame){
    const dt=ts-SANCTUARY_SIM.lastFrame;
    SANCTUARY_SIM.fps=SANCTUARY_SIM.fps*.88+(1000/Math.max(1,dt))*.12;
  }
  SANCTUARY_SIM.lastFrame=ts;
  sanctuaryDraw();
  const f=document.getElementById("sanctuaryFPS");
  if(f)f.textContent=`FPS ${Math.round(SANCTUARY_SIM.fps)}`;
  SANCTUARY_SIM.raf=requestAnimationFrame(sanctuaryLoop);
}
function sanctuaryStart(){
  if(SANCTUARY_SIM.raf)cancelAnimationFrame(SANCTUARY_SIM.raf);
  SANCTUARY_SIM.running=true;SANCTUARY_SIM.lastFrame=0;
  SANCTUARY_SIM.raf=requestAnimationFrame(sanctuaryLoop);
}
function sanctuaryStop(){
  SANCTUARY_SIM.running=false;
  if(SANCTUARY_SIM.raf)cancelAnimationFrame(SANCTUARY_SIM.raf);
  SANCTUARY_SIM.raf=0;
}
function sanctuaryToggleRun(){
  if(SANCTUARY_SIM.running)sanctuaryStop();else sanctuaryStart();
  render();
  setTimeout(()=>{sanctuaryDraw();if(SANCTUARY_SIM.running)sanctuaryStart();},0);
}
function sanctuaryTogglePerf(){
  SANCTUARY_SIM.perf=SANCTUARY_SIM.perf==="full"?"battery":"full";
  render();setTimeout(sanctuaryDraw,0);
}
function sanctuaryFullscreen(){
  const el=document.getElementById("sanctuaryStage");
  if(!el)return;
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});
}
function sanctuaryBeginDrag(ev,id){
  SANCTUARY_SIM.dragObject=id;
  try{ev.currentTarget.setPointerCapture(ev.pointerId)}catch(e){}
  ev.currentTarget.addEventListener("pointermove",sanctuaryDragMove);
  ev.currentTarget.addEventListener("pointerup",sanctuaryEndDrag,{once:true});
}
function sanctuaryDragMove(ev){
  if(!SANCTUARY_SIM.dragObject)return;
  const svg=document.getElementById("sanctuaryObjects");
  if(!svg)return;
  const r=svg.getBoundingClientRect();
  const x=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));
  const y=Math.max(0,Math.min(1,(ev.clientY-r.top)/r.height));
  const o=SANCTUARY_SIM.objects.find(x=>x.id===SANCTUARY_SIM.dragObject);
  if(o){o.x=x;o.y=y;ev.currentTarget.setAttribute("transform",`translate(${x*1000} ${y*560})`);}
}
function sanctuaryEndDrag(ev){
  ev.currentTarget.removeEventListener("pointermove",sanctuaryDragMove);
  SANCTUARY_SIM.dragObject=null;
  if(typeof saveGame==="function")try{saveGame("Sanctuary layout",true)}catch(e){}
}

function animalRescueMission(type,cases,species){
 for(let i=0;i<cases;i++){
  const p=expPatient(state.nextCase++);
  if(species!=="Mixed")p.species=species;
  p.condition=type;
  p.stress=65+((i*7)%20);
  state.patients.push(p);state.activeId=p.id;
 }
 EXP.xp+=8*cases;state.mercy+=5*cases;
 addLog(type+" · "+cases+" animal(s) brought safely into care");
 state.screen="clinic";render();
}
