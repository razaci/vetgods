/* ===== DYNAMIC ANIMAL GAMEPLAY TREE ENGINE ===== */
function ensureTree(p){
 if(!p.tree)p.tree={
  stage:"observe",discovered:[],completed:[],history:[],
  appetite:55,trust:22,fear:65,hydration:55,mobility:50,
  diagnosis:false,stable:false,readyRecovery:false,readyHome:false
 };
 return p.tree;
}
function treeNote(p,text){
 const t=ensureTree(p);t.history.unshift(text);t.history=t.history.slice(0,8);addLog(p.name+" · "+text);
}
function treeObservation(p){
 const t=ensureTree(p);
 if(t.stage==="observe")return `${p.name} is watching the room. ${t.fear>60?"Their body stays tense whenever someone gets close.":"They seem willing to engage."}`;
 if(t.stage==="approach")return t.trust<35?`${p.name} keeps a little distance, but no longer retreats immediately.`:`${p.name} allows you to remain close.`;
 if(t.stage==="exam")return `${p.name}'s exam is revealing what needs attention. ${t.fear>55?"Fear is still making handling difficult.":""}`;
 if(t.stage==="diagnose")return `You have enough observations to choose the next medical path for ${p.name}.`;
 if(t.stage==="treat")return `${p.name} is responding to treatment. Pain ${Math.round(p.pain||0)} · Stress ${Math.round(p.stress||0)}.`;
 if(t.stage==="surgery")return `${p.name} is in the surgical pathway. Keep the animal stable and move one careful step at a time.`;
 if(t.stage==="recover")return `${p.name} is recovering. Appetite, comfort, trust, mobility and rest now matter.`;
 if(t.stage==="home")return `${p.name} is medically ready. The next branch decides where their life continues.`;
 return `${p.name} is waiting for care.`;
}
function unlock(t,n){if(!t.discovered.includes(n))t.discovered.push(n)}
function complete(t,n){if(!t.completed.includes(n))t.completed.push(n)}
function treeAction(id,action){
 const p=state.patients.find(x=>x.id===id);if(!p)return;const t=ensureTree(p);
 if(action==="observe"){unlock(t,"behavior");unlock(t,"breathing");t.stage="approach";treeNote(p,"Observed quietly before touching")}
 if(action==="space"){t.fear=Math.max(0,t.fear-12);p.stress=Math.max(0,(p.stress||45)-10);t.trust+=5;treeNote(p,"Given time and space")}
 if(action==="comfort"){t.fear=Math.max(0,t.fear-15);t.trust+=10;p.stress=Math.max(0,(p.stress||45)-14);treeNote(p,"Accepted gentle comfort")}
 if(action==="approach"){if(t.fear>65){t.fear-=8;treeNote(p,"Backed away; approach slowed down")}else{t.trust+=8;t.stage="exam";treeNote(p,"Allowed a gentle approach")}}
 if(action==="exam"){unlock(t,"pain");unlock(t,"mobility");complete(t,"exam");t.stage="diagnose";treeNote(p,"Physical exam completed")}
 if(action==="heart"){unlock(t,"oxygen");unlock(t,"breathing");t.trust+=2;treeNote(p,"Heart and lungs checked")}
 if(action==="leg"){unlock(t,"mobility");unlock(t,"pain");t.fear+=4;treeNote(p,"Limb examined carefully")}
 if(action==="diagnose"){t.diagnosis=true;complete(t,"diagnosis");t.stage="treat";treeNote(p,"Care pathway identified")}
 if(action==="stabilize"){p.shock=Math.max(0,(p.shock||40)-20);p.oxygen=Math.min(100,(p.oxygen||75)+10);p.pain=Math.max(0,(p.pain||45)-8);t.stable=true;treeNote(p,"Stabilized")}
 if(action==="pain"){p.pain=Math.max(0,(p.pain||45)-22);t.trust+=4;treeNote(p,"Pain brought under better control")}
 if(action==="wound"){p.bleeding=Math.max(0,(p.bleeding||35)-25);p.infection=Math.max(0,(p.infection||25)-10);treeNote(p,"Wound cleaned and protected")}
 if(action==="surgery"){t.stage="surgery";route(p,"Surgery");treeNote(p,"Transferred into surgical pathway");return}
 if(action==="medical"){t.readyRecovery=true;t.stage="recover";route(p,"Recovery");treeNote(p,"Transferred for medical recovery");return}
 if(action==="opstep"){p.surgeryStep=(p.surgeryStep||0)+1;p.bleeding=Math.max(0,(p.bleeding||30)-8);p.shock=Math.max(0,(p.shock||30)-5);treeNote(p,"Surgical step "+p.surgeryStep+" completed");if(p.surgeryStep>=5){t.stage="recover";t.readyRecovery=true;route(p,"Recovery");return}}
 if(action==="rest"){ensureLongPatient(p).rests++;p.stress=Math.max(0,(p.stress||40)-15);t.fear=Math.max(0,t.fear-8);resolveComplication(p);treeNote(p,"Rested quietly");advanceRecoveryFromCare(p,action)}
 if(action==="eat"){ensureLongPatient(p).meals++;t.appetite=Math.min(100,t.appetite+18);t.trust+=4;resolveComplication(p);treeNote(p,"Ate during recovery");advanceRecoveryFromCare(p,action)}
 if(action==="hydrate"){t.hydration=Math.min(100,t.hydration+20);treeNote(p,"Hydration improved");advanceRecoveryFromCare(p,action)}
 if(action==="walk"){ensureLongPatient(p).walks++;t.mobility=Math.min(100,t.mobility+14);p.pain=Math.max(0,(p.pain||25)-3);resolveComplication(p);treeNote(p,"Completed a gentle mobility check");advanceRecoveryFromCare(p,action)}
 if(action==="bond"){t.trust=Math.min(100,t.trust+12);t.fear=Math.max(0,t.fear-10);treeNote(p,"Chose to stay close");advanceRecoveryFromCare(p,action)}
 if(action==="clear"){
  const l=ensureLongPatient(p);l.rechecks++;
  const f=ensureFlow(p);
  const score=Math.max(dischargeScore(p),f.recoveryProgress||0);
  if(score>=80 && l.recoveryDays>=2 && !l.complication){
    t.readyHome=true;t.stage="home";f.dischargeReady=true;
    treeNote(p,"Cleared to leave the ward");
    dischargeRecoveredPet(p.id);
    return;
  } else {
    treeNote(p,"Final check: more recovery care is needed ("+score+"% ready)");
  }
}
 if(action==="mypets"){lifeBookRecord(p,"HOME ❤️");discharge(p);return}
 if(action==="sanctuary"){p.admitted=false;p.department="Sanctuary";EXP.sanctuary.push({...p});lifeBookRecord(p,"SANCTUARY");state.screen="sanctuary";treeNote(p,"Moved into long-term sanctuary care");render();return}
 if(action==="adopt"){p.admitted=false;lifeBookRecord(p,"FAMILY HOME");state.saved++;state.screen="lifebook";treeNote(p,"Matched to a family home");render();return}
 t.trust=clampPet(t.trust);t.fear=clampPet(t.fear);render();
}
function treeActions(p){
 const t=ensureTree(p);
 if(t.stage==="observe")return [["Observe Quietly","observe"],["Give Space","space"],["Speak Softly","comfort"]];
 if(t.stage==="approach")return [["Approach Slowly","approach"],["Sit Nearby","comfort"],["Give More Space","space"]];
 if(t.stage==="exam")return [["Physical Exam","exam"],["Heart + Lungs","heart"],["Examine Limb","leg"]];
 if(t.stage==="diagnose")return [["Build Care Plan","diagnose"],["Heart + Lungs","heart"],["Recheck Mobility","leg"]];
 if(t.stage==="treat"){
  let a=[["Stabilize","stabilize"],["Pain Care","pain"],["Wound Care","wound"]];
  if(t.stable||((p.shock||0)<30))a.push(["Surgical Path","surgery"],["Medical Recovery","medical"]);
  return a.slice(0,5);
 }
 if(t.stage==="surgery")return [["Next Surgical Step","opstep"],["Comfort Before Step","comfort"],["Stabilize","stabilize"]];
 if(t.stage==="recover"){
  let a=[["Quiet Rest","rest"],["Offer Food","eat"],["Hydrate","hydrate"],["Gentle Walk","walk"],["Stay Nearby","bond"]];
  const l=ensureLongPatient(p);
  const f=ensureFlow(p);
  if(f.dischargeReady || (t.appetite>=65&&t.hydration>=65&&t.mobility>=60&&(p.pain||0)<40&&l.recoveryDays>=2&&l.rechecks>=1))a.push(["Final Check · Go Home","clear"]);
  return a;
 }
 if(t.stage==="home")return [["Bring to My Pets","mypets"],["Long-Term Sanctuary","sanctuary"],["Family Adoption","adopt"]];
 return [["Observe","observe"]];
}
function treePath(p){
 const t=ensureTree(p),nodes=["observe","approach","exam","diagnose","treat",p.surgeryRequired?"surgery":null,"recover","home"].filter(Boolean);
 const ci=nodes.indexOf(t.stage);
 return `<div class="tree-path">${nodes.map((n,i)=>`<span class="tree-node ${i<ci?"done":i===ci?"now":""}">${n.toUpperCase()}</span>`).join("")}</div>`;
}
function animalTreeUI(p){
 if(!p)return `<div class="tree-stage"><div class="empty">Select an animal to begin its care story.</div></div>`;
 const t=ensureTree(p),acts=treeActions(p);
 return `<div class="tree-shell">
  <div class="tree-stage">
   ${treePath(p)}
   <div class="tree-patient clickable-animal" onclick="openAnimalProfile('${p.id}')"><img src="${p.image}" alt="${p.name}"><div>
    <h2>${p.name}</h2><div class="small">${p.species} · ${p.condition}</div>
    ${conditionClusterHTML(p)}
    <div class="tree-observation">${treeObservation(p)}</div>
    <div class="small">Trust ${t.trust}% · Fear ${t.fear}% · Appetite ${t.appetite}% · Hydration ${t.hydration}% · Mobility ${t.mobility}%</div>
   </div></div>
   <div class="tree-actions">${acts.map(a=>`<button class="action" onclick="treeAction('${p.id}','${a[1]}')">${a[0]}</button>`).join("")}</div>
   ${t.stage==="recover"?recoveryProgressStatus(p):""}

/* ===== SMART METER ENGINE ===== */
function ensureMeterHistory(p){
 if(!p._meterPrev)p._meterPrev={};
 return p._meterPrev;
}
function metricValue(p,key){
 const t=ensureTree?p&&ensureTree(p):null;
 const s=p&&p.sim?p.sim:null;
 const map={
  pain:()=>Number(p?.pain??s?.pain??0),
  hydration:()=>Number(t?.hydration??p?.hydration??55),
  oxygen:()=>Number(p?.oxygen??80),
  mobility:()=>Number(t?.mobility??50),
  fear:()=>Number(t?.fear??s?.fear??0),
  trust:()=>Number(t?.trust??s?.trust??0),
  loneliness:()=>Number(s?.loneliness??0),
  comfort:()=>Number(s?.comfort??Math.max(0,100-(p?.stress??40))),
  stress:()=>Number(p?.stress??0),
  appetite:()=>Number(t?.appetite??s?.hunger??55)
 };
 return Math.max(0,Math.min(100,map[key]?map[key]():0));
}
function metricMeta(key){
 const meta={
  pain:{label:"Pain",icon:"❤️",bad:true},
  hydration:{label:"Hydration",icon:"💧",bad:false},
  oxygen:{label:"Oxygen",icon:"🫁",bad:false},
  mobility:{label:"Mobility",icon:"🐾",bad:false},
  fear:{label:"Fear",icon:"😨",bad:true},
  trust:{label:"Trust",icon:"🤝",bad:false},
  loneliness:{label:"Lonely",icon:"💔",bad:true},
  comfort:{label:"Comfort",icon:"🛏",bad:false},
  stress:{label:"Stress",icon:"⚡",bad:true},
  appetite:{label:"Appetite",icon:"🍲",bad:false}
 };
 return meta[key];
}
function severityWord(v,bad){
 if(bad){
  if(v<=10)return "None";
  if(v<=30)return "Low";
  if(v<=60)return "Moderate";
  if(v<=80)return "High";
  return "Severe";
 }
 if(v>=85)return "Excellent";
 if(v>=65)return "Good";
 if(v>=40)return "Fair";
 if(v>=20)return "Low";
 return "Critical";
}
function metricUrgency(v,bad){
 return bad?v:(100-v);
}
function smartMeterHTML(p,key){
 const meta=metricMeta(key),v=Math.round(metricValue(p,key)),prev=ensureMeterHistory(p)[key];
 const delta=(typeof prev==="number")?v-prev:0;
 const urgency=metricUrgency(v,meta.bad);
 const priority=urgency>=65;
 let deltaHTML="";
 if(delta){
   const improving=meta.bad?delta<0:delta>0;
   const arrow=delta>0?"↑":"↓";
   const cls=improving?(delta>0?"up":"down"):(meta.bad&&delta>0?"badup":"badup");
   deltaHTML=`<span class="smart-delta ${cls}">${arrow}${Math.abs(delta)}</span>`;
 }
 const cls=`smart-meter ${meta.bad?"bad":"good"} ${priority?"priority":""}`;
 return `<div class="${cls}" data-meter="${key}">
   <div class="smart-label"><b>${meta.icon} ${meta.label}</b><span>${severityWord(v,meta.bad)}</span></div>
   <div class="smart-track"><div class="smart-fill" style="width:${v}%"></div></div>
   <div class="smart-value">${v}${deltaHTML}</div>
 </div>`;
}
function updateMeterHistory(p){
 if(!p)return;
 const h=ensureMeterHistory(p);
 ["pain","hydration","oxygen","mobility","fear","trust","loneliness","comfort","stress","appetite"].forEach(k=>h[k]=Math.round(metricValue(p,k)));
}
function topPriorities(p){
 const keys=["pain","hydration","oxygen","mobility","fear","trust","loneliness","comfort"];
 return keys.map(k=>({k,u:metricUrgency(metricValue(p,k),metricMeta(k).bad)}))
   .sort((a,b)=>b.u-a.u).slice(0,2).map(x=>metricMeta(x.k).label);
}
function conditionSentence(p){
 const pain=metricValue(p,"pain"),fear=metricValue(p,"fear"),trust=metricValue(p,"trust");
 const hydration=metricValue(p,"hydration"),oxygen=metricValue(p,"oxygen"),lonely=metricValue(p,"loneliness");
 let parts=[];
 parts.push(pain<=15?"comfortable":pain<=45?"in mild pain":"in significant pain");
 parts.push(hydration>=70?"well hydrated":hydration>=40?"a little dehydrated":"dehydrated");
 parts.push(oxygen>=90?"breathing comfortably":oxygen>=70?"breathing adequately":"struggling with oxygen");
 if(fear>=65)parts.push("still frightened");
 else if(trust>=65)parts.push("beginning to trust the room");
 else parts.push("watchful but settling");
 if(lonely>=60)parts.push("and showing signs of loneliness");
 return `${p.name} is ${parts.join(", ")}.`;
}
function conditionClusterHTML(p){
 if(!p)return "";
 const priorities=topPriorities(p);
 return `<div class="condition-cluster">
   <div class="condition-group"><h4>Medical</h4>
     ${smartMeterHTML(p,"pain")}
     ${smartMeterHTML(p,"hydration")}
     ${smartMeterHTML(p,"oxygen")}
     ${smartMeterHTML(p,"mobility")}
   </div>
   <div class="condition-group"><h4>Emotional</h4>
     ${smartMeterHTML(p,"fear")}
     ${smartMeterHTML(p,"trust")}
     ${smartMeterHTML(p,"loneliness")}
     ${smartMeterHTML(p,"comfort")}
   </div>
 </div>
 <div class="condition-summary">${conditionSentence(p)}</div>
 <div class="condition-priority">Needs attention first: ${priorities.join(" · ")}</div>`;
}
function applyMeterInteractions(p){
 if(!p)return;
 const t=ensureTree(p);
 const s=p.sim?ensurePetSim(p):null;
 // Cross-meter simulation: bad states affect other systems gradually.
 if((p.pain||0)>65)t.fear=Math.min(100,t.fear+3);
 if(t.fear>70)t.appetite=Math.max(0,t.appetite-3);
 if(s&&s.loneliness>65)t.trust=Math.max(0,t.trust-2);
 if(s&&s.comfort>70)t.fear=Math.max(0,t.fear-2);
 if(t.hydration>70 && p.department==="Recovery")t.mobility=Math.min(100,t.mobility+1);
 if(t.trust>75)t.fear=Math.max(0,t.fear-1);
}

function patientObjectives(p){

 ];

function createSecondary(p){
 const l=ensureLongPatient(p);
 if(l.secondary||((p.id.length+LONGSIM.totalShifts)%4!==0))return;
 const findings=["mild dehydration","early infection","mobility weakness","stress-related appetite loss","respiratory irritation"];
 l.secondary=findings[(LONGSIM.totalShifts+p.name.length)%findings.length];
 l.storyBeat=`A second problem was discovered: ${l.secondary}.`;
 if(l.secondary.includes("dehydration"))ensureTree(p).hydration=Math.max(20,ensureTree(p).hydration-18);
 if(l.secondary.includes("infection"))p.infection=Math.min(100,(p.infection||15)+20);

function maybeComplication(p){

 const risk=(p.pain||0)+(p.stress||0)+(100-t.hydration);
 if(risk>135 && (LONGSIM.totalShifts+p.name.length)%3===0){
   l.complication=["post-treatment swelling","refused food after a stressful night","wound irritation","poor sleep and rising fear"][LONGSIM.totalShifts%4];
   l.storyBeat="Recovery paused while the team handles a complication.";
   longEvent(`${p.name} developed ${l.complication}.`);
 }

 const l=ensureLongPatient(p);if(!l.complication)return;
 if((p.pain||0)<40 && ensureTree(p).hydration>=60 && ensureTree(p).fear<65){
  longEvent(`${p.name}'s complication resolved.`);l.complication=null;l.storyBeat="The setback passed and recovery resumed.";

function relationshipTick(){
 const list=admitted().filter(p=>p.department==="Recovery");
 if(list.length<2)return;
 for(let i=0;i<list.length-1;i++){
   const a=list[i],b=list[i+1],la=ensureLongPatient(a),lb=ensureLongPatient(b);
   if(!la.relationship && ensureTree(a).fear<70 && ensureTree(b).fear<70){
    la.relationship=`${a.name} has started settling when ${b.name} is nearby.`;
    lb.relationship=`${b.name} recognizes ${a.name} across the recovery ward.`;
    ensureTree(a).fear=Math.max(0,ensureTree(a).fear-5);
    ensureTree(b).fear=Math.max(0,ensureTree(b).fear-5);

function progressChapter(){

 if(completed>=8)target=Math.max(target,5);if(LONGSIM.totalShifts>=24)target=Math.max(target,6);
 if(completed>=12)target=Math.max(target,7);if(completed>=18)target=8;

function advanceHospitalShift(){
 LONGSIM.totalShifts++;LONGSIM.shiftIndex=(LONGSIM.shiftIndex+1)%4;
 if(LONGSIM.shiftIndex===0)LONGSIM.day++;
 admitted().forEach(p=>{
  const l=ensureLongPatient(p),t=ensureTree(p);
  if(p.department==="Recovery"){l.recoveryDays++;l.rests++;p.stress=Math.max(0,(p.stress||40)-4);t.fear=Math.max(0,t.fear-3)}
  if(LONGSIM.shiftIndex===0){t.appetite=Math.max(0,t.appetite-7);t.hydration=Math.max(0,t.hydration-6)}

 }

 c.lastOutcome=`${item[1]} completed for ${p.name}.`;

 if(c[doneKey].length>=2 && c[levelKey]<1)c[levelKey]=1;

/* ===== PERSISTENT SAVE SYSTEM ===== */
const SAVE_KEY="VET_GODS_PERSISTENT_SAVE_V2";
const SAVE_ARCHIVE_KEY="VET_GODS_SAVE_ARCHIVE_V2";
let SAVE_READY=false;
let SAVE_STATUS="Not saved yet";

function snapshotGame(){
  return {
    version:2,
    savedAt:new Date().toISOString(),
    state:JSON.parse(JSON.stringify(state)),
    econ:JSON.parse(JSON.stringify(ECON)),
    exp:JSON.parse(JSON.stringify(EXP)),
    longsim:JSON.parse(JSON.stringify(LONGSIM))
  };
}
function applySavedObject(target,source){
  if(!source||typeof source!=="object")return;
  Object.keys(target).forEach(k=>delete target[k]);
  Object.assign(target,source);
}
function saveGame(label="Auto Save",silent=true){
  try{
    const snap=snapshotGame();
    localStorage.setItem(SAVE_KEY,JSON.stringify(snap));
    let archive=[];
    try{archive=JSON.parse(localStorage.getItem(SAVE_ARCHIVE_KEY)||"[]")}catch(e){}
    if(!Array.isArray(archive))archive=[];
    if(label!=="Auto Save"){
      archive.unshift({
        label,
        savedAt:snap.savedAt,
        pets:snap.state.pets,
        inventory:snap.econ.inventory,
        saved:snap.state.saved,
        mercy:snap.state.mercy,
        lifeBook:snap.exp.lifeBook,
        sanctuary:snap.exp.sanctuary,
        day:snap.longsim.day,
        chapter:snap.longsim.chapter
      });
      archive=archive.slice(0,12);
      localStorage.setItem(SAVE_ARCHIVE_KEY,JSON.stringify(archive));
    }
    SAVE_STATUS=`${label} · ${new Date(snap.savedAt).toLocaleString()}`;
    if(!silent)render();
    return true;
  }catch(e){
    SAVE_STATUS="Save failed: "+e.message;
    return false;
  }
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const snap=JSON.parse(raw);
    if(!snap||!snap.state)return false;
    applySavedObject(state,snap.state);
    if(snap.econ)applySavedObject(ECON,snap.econ);
    if(snap.exp)applySavedObject(EXP,snap.exp);
    if(snap.longsim)applySavedObject(LONGSIM,snap.longsim);
    SAVE_STATUS=`Loaded · ${snap.savedAt?new Date(snap.savedAt).toLocaleString():"previous save"}`;
    return true;
  }catch(e){
    SAVE_STATUS="Could not load save: "+e.message;
    return false;
  }
}
function saveNow(){
  saveGame("Manual Save",false);
}
function getSaveArchive(){
  try{
    const a=JSON.parse(localStorage.getItem(SAVE_ARCHIVE_KEY)||"[]");
    return Array.isArray(a)?a:[];
  }catch(e){return []}
}
function exportSave(){
  const snap=snapshotGame();
  const blob=new Blob([JSON.stringify(snap,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="VET_GODS_SAVE_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  SAVE_STATUS="Exported backup";
  render();
}
function importSaveFile(input){
  const file=input.files&&input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const snap=JSON.parse(reader.result);
      if(!snap||!snap.state)throw new Error("Not a VET GODS save file");
      applySavedObject(state,snap.state);
      if(snap.econ)applySavedObject(ECON,snap.econ);
      if(snap.exp)applySavedObject(EXP,snap.exp);
      if(snap.longsim)applySavedObject(LONGSIM,snap.longsim);
      saveGame("Imported Save",true);
      SAVE_STATUS="Imported backup successfully";
      render();
    }catch(e){
      SAVE_STATUS="Import failed: "+e.message;render();
    }
  };
  reader.readAsText(file);
}
function archiveHTML(){
  const a=getSaveArchive();
  if(!a.length)return `<div class="small">No manual save snapshots yet. Press <b>Save Everything</b> to create one.</div>`;
  return `<div class="save-archive">${a.map((s,i)=>`
    <div class="memory">
      <b>${s.label||"Save"} ${i+1}</b><br>
      ${new Date(s.savedAt).toLocaleString()} · Day ${s.day||1} · Chapter ${s.chapter||1}<br>
      Pets: ${(s.pets||[]).length} · Saved animals: ${s.saved||0}<br>
      Inventory: ${Object.entries(s.inventory||{}).map(([k,v])=>`${k} ${v}`).join(" · ")||"none"}
    </div>`).join("")}</div>`;
}
function persistentSavePanel(){
  return `<div class="panel save-panel">

/* ===== GUARANTEED CLINIC -> RECOVERY -> HOME FLOW ===== */
function ensureFlow(p){
 if(!p.flow)p.flow={
   clinicProgress:0,
   stabilized:false,
   treatmentChosen:false,
   readyForRecovery:false,
   recoveryProgress:0,
   dischargeReady:false,
   outcomeNote:""
 };
 return p.flow;
}
function syncFlowFromPatient(p){
 const f=ensureFlow(p),t=ensureTree(p);
 let score=0;
 if((p.pain||50)<=45)score+=20;
 if((p.oxygen||85)>=90)score+=20;
 if((t.hydration||55)>=60)score+=20;
 if((p.bleeding||20)<=20)score+=20;
 if((p.shock||30)<=25)score+=20;
 f.clinicProgress=Math.max(f.clinicProgress,score);
 if(score>=60)f.stabilized=true;
 if(f.stabilized&&f.treatmentChosen)f.readyForRecovery=true;
 return f;
}

 const f=syncFlowFromPatient(p);
 return `<div class="panel" style="margin-top:10px">

     <div class="meter-label">Clinic stabilization</div>
     <div class="meter"><i style="width:${Math.min(100,f.clinicProgress)}%"></i></div>
     <div class="meter-value">${Math.min(100,f.clinicProgress)}%</div>
   </div>
   <div class="controls" style="margin-top:8px">
     ${!f.stabilized?`
       <button class="action green" onclick="stabilizeForRecovery('${p.id}')">Stabilize Patient</button>
     `:""}
     ${f.stabilized&&!f.treatmentChosen?`
       <button class="action" onclick="chooseClinicTreatment('${p.id}','medical')">Choose Medical Treatment</button>
       <button class="action" onclick="chooseClinicTreatment('${p.id}','supportive')">Choose Supportive Care</button>
     `:""}
     ${f.readyForRecovery?`
       <button class="action green" onclick="sendPatientToRecovery('${p.id}')">Send to Recovery</button>
     `:""}
   </div>
   <div class="small" style="margin-top:7px">${f.outcomeNote||(
     !f.stabilized?"Treat pain, hydration, oxygen, bleeding, and shock enough to stabilize.":

   )}</div>
 </div>`;
}
function stabilizeForRecovery(id){
 const p=state.patients.find(x=>x.id===id); if(!p)return;
 const t=ensureTree(p),f=ensureFlow(p);
 p.pain=Math.max(0,(p.pain||50)-18);
 p.oxygen=Math.min(100,(p.oxygen||84)+10);
 p.bleeding=Math.max(0,(p.bleeding||25)-12);
 p.shock=Math.max(0,(p.shock||35)-15);
 t.hydration=Math.min(100,(t.hydration||50)+18);
 f.clinicProgress=Math.max(65,f.clinicProgress);
 f.stabilized=true;

 treeNote(p,"Clinic stabilization completed");

function recoveryCare(id,action){
 const p=state.patients.find(x=>x.id===id); if(!p)return;
 const t=ensureTree(p),f=ensureFlow(p),l=ensureLongPatient(p);
 if(action==="rest"){
   p.pain=Math.max(0,(p.pain||45)-8);
   t.fear=Math.max(0,(t.fear||50)-5);
   l.rests++;
 }
 if(action==="feed"){
   t.hydration=Math.min(100,(t.hydration||55)+14);
   t.appetite=Math.min(100,(t.appetite||45)+16);
   l.meals++;
 }
 if(action==="walk"){
   t.mobility=Math.min(100,(t.mobility||45)+14);
   p.pain=Math.max(0,(p.pain||40)-3);
   l.walks++;
 }
 if(action==="comfort"){
   t.fear=Math.max(0,(t.fear||50)-14);
   t.trust=Math.min(100,(t.trust||40)+10);
 }
 if(action==="advance"){
   l.recoveryDays++;
   l.rechecks++;
   t.appetite=Math.min(100,(t.appetite||50)+5);
   t.hydration=Math.min(100,(t.hydration||55)+4);
   p.pain=Math.max(0,(p.pain||40)-4);
 }
 f.recoveryProgress=0; // force recalculation
 treeNote(p,"Recovery care: "+action);
 saveGame("Auto Save",true);
 render();
}

 if(!state.pets.some(x=>x.id===p.id))state.pets.push(p);
 state.saved=(state.saved||0)+1;
 f.outcomeNote=`${p.name} completed recovery and went home.`;

/* ===== RECOVERY ACTIONS NOW ADVANCE TIME/PROGRESS ===== */
function advanceRecoveryFromCare(p,action){
 const l=ensureLongPatient(p),t=ensureTree(p),f=ensureFlow(p);
 if(!p.recoveryActionCount)p.recoveryActionCount=0;
 if(!p.recoveryShiftActions)p.recoveryShiftActions=[];
 p.recoveryActionCount++;
 p.recoveryShiftActions.push(action);

 // Every 4 care actions completes one recovery shift.
 if(p.recoveryShiftActions.length>=4){
   l.recoveryDays++;
   l.rechecks++;
   p.recoveryShiftActions=[];
   t.appetite=Math.min(100,(t.appetite||50)+4);
   t.hydration=Math.min(100,(t.hydration||55)+4);
   t.mobility=Math.min(100,(t.mobility||50)+3);
   p.pain=Math.max(0,(p.pain||35)-3);
   resolveComplication(p);
   treeNote(p,`Recovery shift ${l.recoveryDays} completed automatically`);
 }

 // Recalculate readiness every press.
 let score=0;
 if((p.pain||50)<=30)score+=20;
 if((t.hydration||55)>=70)score+=20;
 if((t.appetite||50)>=65)score+=20;
 if((t.mobility||50)>=60)score+=20;
 if((t.fear||50)<=40)score+=20;
 f.recoveryProgress=score;

 // Once two shifts are complete and the animal is healthy enough,
 // automatically unlock the final check.
 if(l.recoveryDays>=2 && l.rechecks>=1 && score>=80){
   f.dischargeReady=true;
   t.readyHome=true;
   treeNote(p,`${p.name} is ready for the final check`);
 }
 saveGame("Auto Save",true);
}
function recoveryProgressStatus(p){
 const l=ensureLongPatient(p),f=ensureFlow(p);
 const left=4-((p.recoveryShiftActions||[]).length);
 return `<div class="small" style="margin-top:7px">
   Recovery shifts: ${l.recoveryDays}/2 ·
   Readiness: ${Math.min(100,f.recoveryProgress||0)}% ·
   ${l.recoveryDays<2?`${left} care action${left===1?"":"s"} until next recovery shift`:
   f.dischargeReady?"Ready for final check":"Continue care until readiness reaches 80%"}
 </div>`;
}

function vgfxSceneTitle(screen){
 const meta={
   clinic:["PATIENT TRIAGE","Animal-first medical command"],
   surgery:["SURGERY THEATER","Procedure and stabilization deck"],
   recovery:["RECOVERY WARD","Quiet healing and discharge"],
   pets:["MY PETS","Home care and bonding"],
   admit:["ADMIT ANIMAL","Immediate intake including exotics"],
   habitats:["HABITAT CENTER","Enclosures and species environments"],
   reception:["RECEPTION","Incoming animal rescue signals"],
   ambulance:["RESCUE BAY","Emergency animal transport"],
   research:["RESEARCH","Exotic observation and care"],
   sanctuary:["SANCTUARY","Long-term protected animals"],
   world:["WORLD MAP","Rescue sectors"],
   lifebook:["LIFE BOOK","Animal stories and outcomes"],
   carelab:["CARE LAB","Examine · Medical · Emotional"],
   hospital:["HOSPITAL","Station-wide care"],
   status:["STATUS","Hospital command readout"],
   animalprofile:["ANIMAL PROFILE","Life Spark record"]
 };
 return meta[screen]||["VET GODS","Animal Life-Spark Command"];
}

function vgfxSceneHTML(screen){
 const img=VGFX_SCENES[screen];
 if(!img)return "";
 const meta=vgfxSceneTitle(screen);
 return `<div class="vgfx-scene">
   <img src="${img}" alt="${meta[0]}">
   <div class="vgfx-scene-overlay">
     <div><b>${meta[0]}</b><span>${meta[1]}</span></div>
     <div class="vgfx-life"><span>●</span> LIFE SPARK LINK</div>
   </div>
 </div>`;
}

function vgfxInstallScene(screen){
 const el=document.getElementById(screen);
 if(!el || !VGFX_SCENES[screen])return;
 if(el.querySelector(":scope > .vgfx-scene"))return;
 el.insertAdjacentHTML("afterbegin",vgfxSceneHTML(screen));
}

function render(){
  try{
    if(typeof updatePetHomeSim==="function")updatePetHomeSim();
    if(typeof updateRealTimePetDecay==="function")updateRealTimePetDecay();
    if(!Array.isArray(state.patients))state.patients=[];
    if(!Array.isArray(state.pets))state.pets=[];
    if(!Array.isArray(state.log))state.log=[];

    const validScreens=["clinic","surgery","recovery","pets","status","admit","hospital","sanctuary","world","lifebook","reception","ambulance","research","carelab","animalprofile","habitats"];
    if(!validScreens.includes(state.screen))state.screen="clinic";

    const mercyEl=document.getElementById("mercy");
    const savedEl=document.getElementById("saved");
    if(mercyEl)mercyEl.textContent=state.mercy||0;
    if(savedEl)savedEl.textContent=state.saved||0;

    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.screen===state.screen));
    document.querySelectorAll(".quick-links button").forEach(b=>b.classList.toggle("active",b.dataset.screen===state.screen));

    const target=document.getElementById(state.screen)||document.getElementById("clinic");
    if(target)target.classList.add("active");

    const ap=active();
    if(ap&&ap.admitted){
      try{applyMeterInteractions(ap)}catch(e){console.warn("meter interactions skipped",e)}
    }

    const renderers={
      clinic:renderClinic,
      surgery:renderSurgery,
      recovery:renderRecovery,
      pets:renderPets,
      status:renderStatus,
      admit:renderAdmit,
      hospital:renderHospitalPlus,
      sanctuary:renderSanctuary,
      world:renderWorld,
      lifebook:renderLifeBook,
      reception:renderReception,
      ambulance:renderAmbulance,
      research:renderResearch,
      carelab:typeof renderCareLab==="function"?renderCareLab:null,
      animalprofile:typeof renderAnimalProfile==="function"?renderAnimalProfile:null,
      habitats:typeof renderHabitats==="function"?renderHabitats:null
    };

    const fn=renderers[state.screen]||renderClinic;
    if(typeof fn==="function")fn();

    if(typeof applyTreeDepartmentUI==="function" && ["clinic","surgery","recovery"].includes(state.screen)){
      applyTreeDepartmentUI();
    }

    if(typeof vgfxInstallScene==="function"){
      try{vgfxInstallScene(state.screen)}catch(e){console.warn("graphic scene skipped",e)}
    }

    if(ap&&typeof updateMeterHistory==="function"){
      try{updateMeterHistory(ap)}catch(e){console.warn("meter history skipped",e)}
    }

    if(typeof SAVE_READY!=="undefined" && SAVE_READY && typeof saveGame==="function"){
      try{saveGame("Auto Save",true)}catch(e){console.warn("autosave skipped",e)}
    }
  }catch(err){
    console.error("VET GODS render error:",err);
    const target=document.getElementById(state.screen)||document.getElementById("clinic");
    if(target){
      target.classList.add("active");
      target.innerHTML=`<div class="panel">
        <h2>🐾 VET GODS</h2>
        <p class="small">This room hit a display error, but your save is still safe.</p>
        <div class="small" style="opacity:.75;margin:8px 0">Error: ${String(err&&err.message?err.message:err)}</div>
        <button class="action green" onclick="state.screen='clinic';render()">Return to Clinic</button>
      </div>`;
    }
  }
}

function setGameMenu(open){
  const menu=document.getElementById("gameMenu");
  const back=document.getElementById("menuBackdrop");
  const toggle=document.getElementById("menuToggle");
  if(!menu||!back||!toggle)return;
  menu.classList.toggle("open",!!open);
  back.classList.toggle("open",!!open);
  menu.setAttribute("aria-hidden",open?"false":"true");
  back.setAttribute("aria-hidden",open?"false":"true");
  toggle.setAttribute("aria-expanded",open?"true":"false");
}
document.getElementById("menuToggle")?.addEventListener("click",()=>setGameMenu(true));
document.getElementById("menuClose")?.addEventListener("click",()=>setGameMenu(false));
document.getElementById("menuBackdrop")?.addEventListener("click",()=>setGameMenu(false));
document.querySelectorAll("[data-screen]").forEach(b=>{
  b.addEventListener("click",ev=>{
    ev.preventDefault();
    ev.stopPropagation();
    state.screen=b.dataset.screen||"clinic";
    setGameMenu(false);
    render();
  });
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")setGameMenu(false);});

function vgHash(i,a,b){ return (i*37 + a*17 + b*11) % 9973; }
function vgPick(arr,i,salt){ return arr[(vgHash(i,salt,arr.length)) % arr.length]; }
function vgAmazonSearch(q){
  return "https://www.amazon.com/s?k="+encodeURIComponent(q);
}
function vgOpenExternal(url){
  try{
    // Best for local/single-file HTML on mobile: navigate the browser directly.
    window.location.href=url;
  }catch(err){
    try{ window.open(url,"_blank"); }catch(e){}
  }
  return false;
}
function vgEscape(s){
  return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function vgProblemCombo(i,species=null){
  const exoticKeys=["bad_molt","low_humidity","high_humidity","substrate_issue","shell_damage","grip_weakness","water_quality","calcium_need","wrong_temperature","ventilation_issue","molt_rest"];
  const exoticSet=new Set(["Tarantula","Jumping Spider","Orb Weaver","Scorpion","Praying Mantis","Stick Insect","Leaf Insect","Beetle","Millipede","Centipede","Giant Land Snail","Hermit Crab","Freshwater Crab","Axolotl","Tree Frog","Pacman Frog","Newt","Salamander","Ant Colony","Isopod Colony","Dubia Roach Colony","Vinegaroon"]);
  const pool=exoticSet.has(species)
    ? VG_PROBLEMS.filter(p=>exoticKeys.includes(p.key) || ["dehydration","poor_appetite","anxiety","recovery_rest"].includes(p.key))
    : VG_PROBLEMS.filter(p=>!exoticKeys.includes(p.key));
  const one=pool[i % pool.length];
  let two=pool[(i*7+11)%pool.length];
  let three=pool[(i*13+5)%pool.length];
  if(two.key===one.key)two=pool[(i*7+12)%pool.length];
  if(three.key===one.key||three.key===two.key)three=pool[(i*13+7)%pool.length];
  const count=1+(i%3);
  return [one,two,three].slice(0,count);
}
function vgMakeDatabaseAnimal(i){
  const species=VG_SPECIES[i%VG_SPECIES.length];
  const breed=vgPick(VG_BREEDS[species]||["Mixed"],i,3);
  const name=VG_NAMES[i%VG_NAMES.length] + (i>=VG_NAMES.length ? " "+(Math.floor(i/VG_NAMES.length)+1) : "");
  const problems=vgProblemCombo(i,species);
  const maxSeverity=Math.max(...problems.map(p=>p.severity));
  const adoptChance=(i*19+27)%100;
  const disposition=adoptChance<58?"Eligible for My Pets after recovery":adoptChance<80?"Sanctuary / foster candidate":"Return-home / release candidate";
  return {
    dbId:"VG"+String(i+1).padStart(3,"0"),
    name,
    species,
    breed,
    ageLabel:["Young","Adult","Adult","Senior"][i%4],
    sex:i%2?"Female":"Male",
    problems,
    disposition,
    canBecomePet:adoptChance<58,
    personality:["gentle","shy","curious","watchful","playful","quiet","brave","cautious","social","independent"][i%10],
    backstory:[
      "Found waiting near an empty house after a family moved away.",
      "Arrived from a crowded shelter transfer with little history.",
      "Brought in after being found cold and alone near a roadside.",
      "Surrendered with an old blanket and a handwritten note.",
      "Rescued after several days hiding beneath a porch.",
      "Transferred after an evacuation separated the animal from its records.",
      "Found wandering near a closed store and brought to safety.",
      "Came from a foster home that could no longer provide medical care.",
      "Recovered by an animal-control team after a storm.",
      "Brought in by a neighbor who had been leaving food outside."
    ][i%10],
    maxSeverity
  };
}
const VG_ANIMAL_DATABASE = Array.from({length:654},(_,i)=>vgMakeDatabaseAnimal(i));

function vgDatabaseAnimalToPatient(db){
  const idx=parseInt(db.dbId.slice(2),10)-1;
  const p=makePatient(state.nextCase++);
  p.name=db.name;
  p.species=db.species;
  p.breed=db.breed;
  p.condition=db.problems.map(x=>x.name).join(" + ");
  p.department="Clinic";
  p.location="Clinic";
  p.admitted=true;
  p.dbId=db.dbId;
  p.dbProblems=db.problems.map(x=>x.key);
  p.canBecomePet=db.canBecomePet;
  p.disposition=db.disposition;
  p.personality=db.personality;
  p.backstory=db.backstory;
  p.image=THUMBS[idx%THUMBS.length];

  const sev=db.maxSeverity;
  p.pain=Math.min(90,24+sev*12+(idx%13));
  p.stress=Math.min(95,34+sev*9+(idx%17));
  p.shock=sev>=4?40:Math.max(5,sev*7);
  p.bleeding=db.problems.some(x=>x.key==="minor_wound")?30:8;
  p.infection=db.problems.some(x=>["minor_wound","dental","ear_irritation"].includes(x.key))?24:7;
  p.oxygen=db.problems.some(x=>x.key==="respiratory")?78:96;
  p.hydration=db.problems.some(x=>x.key==="dehydration")?45:72;
  if(typeof ensureTree==="function"){
    const t=ensureTree(p);
    t.hydration=p.hydration||65;
    t.fear=Math.min(90,p.stress||50);
    t.trust=20+(idx%25);
    t.loneliness=35+(idx%40);
    t.comfort=35+(idx%25);
    t.mobility=db.problems.some(x=>x.key==="mobility"||x.key==="joint_stiffness")?42:72;
    t.appetite=db.problems.some(x=>x.key==="poor_appetite")?38:68;
  }
  if(typeof ensureLongPatient==="function")ensureLongPatient(p);
  if(typeof ensureFlow==="function")ensureFlow(p);
  return p;
}

function admitDatabaseAnimal(dbId){
  const db=VG_ANIMAL_DATABASE.find(x=>x.dbId===dbId);
  if(!db)return;
  if(state.patients.some(p=>p.admitted&&p.dbId===dbId)){
    const existing=state.patients.find(p=>p.admitted&&p.dbId===dbId);
    state.activeId=existing.id;
    state.screen="clinic";
    render();
    return;
  }
  const p=vgDatabaseAnimalToPatient(db);
  state.patients.push(p);
  state.activeId=p.id;
  state.screen="clinic";
  addLog(`${p.name} admitted from the 654-animal database`);
  if(typeof saveGame==="function")try{saveGame("Animal admitted",true)}catch(e){}
  render();
}

  const serious=pr.severity>=3;
  return `<div class="vg-problem">
    <div class="vg-problem-title">${serious?"⚠️":"🐾"} ${vgEscape(pr.name)}</div>
    <div class="small">${vgEscape(pr.solution)}</div>
    <a class="vg-amazon" href="${vgAmazonSearch(pr.search)}" onclick="return vgOpenExternal(this.href)">Search Amazon for supplies ↗</a>

}

function vgFeaturedExoticsHTML(){
  if(typeof VG_ANIMAL_DATABASE==="undefined")return "";
  const picks=[];
  for(const species of VG_EXOTIC_FIRST_SPECIES){
    const found=VG_ANIMAL_DATABASE.find(a=>a.species===species && !state.patients.some(p=>p.databaseId===a.id));
    if(found)picks.push(found);
    if(picks.length>=8)break;
  }
  if(!picks.length)return "";
  return `<div class="panel vg-exotic-intake">
    <div class="vg-exotic-head">
      <div>
        <h3>🕷️🐜 Exotic Intake · Available Now</h3>
        <div class="small">Spiders, insects, colonies and other exotics are available immediately.</div>
      </div>
    </div>
    <div class="vg-exotic-strip">
      ${picks.map(a=>{
        const pr=(a.problemKeys||[]).map(k=>VG_PROBLEMS.find(x=>x.key===k)).filter(Boolean)[0];
        return `<button class="vg-exotic-pick" onclick="event.stopPropagation();vgAdmitDatabaseAnimal('${a.id}')">
          <b>${vgEscape(a.species)}</b>
          <span>${vgEscape(a.name)}</span>
          <small>${pr?vgEscape(pr.name):"Exotic care case"}</small>
          <em>ADMIT</em>
        </button>`;
      }).join("")}
    </div>
  </div>`;
}

function vgRenderDatabaseBrowser(){
  const el=document.getElementById("vgAnimalDatabase");
  if(!el)return;
  const q=(VG_DB_FILTER||"").trim().toLowerCase();
  let rows=VG_ANIMAL_DATABASE.filter(a=>{
    const hay=[a.name,a.dbId,a.species,a.breed,...a.problems.map(p=>p.name)].join(" ").toLowerCase();
    return (!q||hay.includes(q)) && (VG_DB_SPECIES==="All"||a.species===VG_DB_SPECIES);
  });
  const pageSize=10, pages=Math.max(1,Math.ceil(rows.length/pageSize));
  VG_DB_PAGE=Math.min(Math.max(0,VG_DB_PAGE),pages-1);
  const page=rows.slice(VG_DB_PAGE*pageSize,(VG_DB_PAGE+1)*pageSize);

  el.innerHTML=`
    <div class="vg-db-toolbar">
      <input id="vgDbSearch" value="${vgEscape(VG_DB_FILTER)}" placeholder="Search name, species, problem…" oninput="VG_DB_FILTER=this.value;VG_DB_PAGE=0;vgRenderDatabaseBrowser()">
      <select onchange="VG_DB_SPECIES=this.value;VG_DB_PAGE=0;vgRenderDatabaseBrowser()">
        <option ${VG_DB_SPECIES==="All"?"selected":""}>All</option>
        ${VG_SPECIES.map(s=>`<option ${VG_DB_SPECIES===s?"selected":""}>${s}</option>`).join("")}
      </select>
    </div>
    <div class="small" style="margin:7px 0">${rows.length} matching animals · showing ${page.length} at a time</div>
    <div class="vg-db-grid">${page.map(vgAnimalDatabaseCard).join("")}</div>
    <div class="vg-db-pager">
      <button onclick="VG_DB_PAGE=Math.max(0,VG_DB_PAGE-1);vgRenderDatabaseBrowser()">← Previous</button>
      <b>Page ${VG_DB_PAGE+1} / ${pages}</b>
      <button onclick="VG_DB_PAGE=Math.min(${pages-1},VG_DB_PAGE+1);vgRenderDatabaseBrowser()">Next →</button>
    </div>`;
}

function vgEnsureDynamicCare(p){
  if(!p.dynamicCare){
    const db=VG_ANIMAL_DATABASE.find(a=>a.dbId===p.dbId);
    const group=VG_SPECIES_GROUP[p.species]||"canine";
    p.dynamicCare={
      group,
      stage:"discover",
      step:0,
      revealCount:0,
      treatmentCount:0,
      recoveryCount:0,
      discovered:[],
      treated:[],
      notes:[],
      completed:false,
      routeSeed:parseInt((p.dbId||"VG001").slice(2),10)||1,
      problemKeys:db?db.problems.map(x=>x.key):(p.dbProblems||[])
    };
  }
  return p.dynamicCare;
}

function vgUniqueButtons(arr,limit=4){
  const seen=new Set(), out=[];
  for(const x of arr){
    if(!x||seen.has(x))continue;
    seen.add(x); out.push(x);
    if(out.length>=limit)break;
  }
  return out;
}

function vgDynamicChoices(p){
  const d=vgEnsureDynamicCare(p);
  const group=VG_CARE_GROUPS[d.group]||VG_CARE_GROUPS.canine;
  const paths=d.problemKeys.map(k=>VG_PROBLEM_PATHS[k]).filter(Boolean);

  if(d.stage==="discover"){
    const pool=[
      ...group.discovery,
      ...paths.flatMap(x=>x.discover||[]),
      p.personality==="shy"?"Approach Slowly":null,
      p.personality==="watchful"?"Watch From Distance":null,
      p.personality==="curious"?"Offer Safe Interaction":null
    ];
    return vgUniqueButtons(pool.slice(d.step%Math.max(1,pool.length)).concat(pool),4);
  }

  if(d.stage==="treat"){
    const pool=[
      ...paths.flatMap(x=>x.treat||[]),
      ...group.treatment,
      p.personality==="shy"?"Reduce Fear":null,
      p.personality==="social"?"Stay Nearby":null,
      p.personality==="independent"?"Give Space":null
    ];
    return vgUniqueButtons(pool.slice((d.step+2)%Math.max(1,pool.length)).concat(pool),4);
  }

  if(d.stage==="recover"){
    const phase=Math.min(4,Math.floor((d.recoveryCount||0)/4));
    const base=[
      ...paths.flatMap(x=>x.recover||[]),
      ...group.recovery
    ];

    const phaseChoices=[
      [
        "Quiet Rest","Offer Food","Hydrate","Stay Nearby",
        "Warm Blanket","Pain Recheck","Dim the Lights","Fresh Bedding"
      ],
      [
        "Gentle Walk","Mobility Check","Offer Favorite Food","Fresh Water",
        "Comfort Touch","Check Appetite","Reposition Bed","Calm Voice"
      ],
      [
        "Short Enrichment","Groom / Clean","Recheck Wound","Monitor Breathing",
        "Slow Stretch","Window Time","Companion Visit","Quiet Nap"
      ],
      [
        "Longer Gentle Walk","Practice Routine","Normal Meal","Independent Rest",
        "Trust Exercise","Final Hydration","Recovery Play","Observe Overnight"
      ],
      [
        "Final Vitals","Final Mobility","Final Appetite","Final Comfort",
        "Discharge Talk","Pack Home Supplies","One Last Check","Go Home"
      ]
    ];

    const personality=[
      p.personality==="playful"?"Play / Enrichment":null,
      p.personality==="gentle"?"Comfort":null,
      p.personality==="shy"?"Sit Quietly Nearby":null,
      p.personality==="social"?"Companion Time":null,
      p.personality==="independent"?"Give Space":null
    ];

    const pool=[
      ...phaseChoices[phase],
      ...base,
      ...personality
    ];

    return vgUniqueButtons(pool.slice((d.step+phase)%Math.max(1,pool.length)).concat(pool),6);
  }

  return ["Final Check · Go Home"];
}


function vgRecoveryPhaseName(p){
  const d=vgEnsureDynamicCare(p);
  const c=d.recoveryCount||0;
  if(c<4)return "Phase 1 · Settle & Stabilize";
  if(c<8)return "Phase 2 · Eat, Drink & Move";
  if(c<12)return "Phase 3 · Rebuild Comfort";
  if(c<16)return "Phase 4 · Prepare for Home";
  return "Phase 5 · Final Checks";
}

function vgDynamicStatus(p){
  const d=vgEnsureDynamicCare(p);
  if(d.stage==="discover")return `Discovery ${Math.min(3,d.revealCount)}/3`;
  if(d.stage==="treat")return `Treatment ${Math.min(4,d.treatmentCount)}/4`;
  if(d.stage==="recover")return `Recovery ${Math.min(4,d.recoveryCount)}/4`;
  return "Complete";
}

function vgDynamicCareHTML(p){
  if(!p||!p.dbId)return "";
  const d=vgEnsureDynamicCare(p);
  const db=VG_ANIMAL_DATABASE.find(a=>a.dbId===p.dbId);
  const stageTitle=d.stage==="discover"?"Find Out What's Wrong":d.stage==="treat"?"Treat What You Found":d.stage==="recover"?"Recovery Care":"Case Complete";
  const choices=vgDynamicChoices(p);

  let reveal="";
  if(d.discovered.length){
    reveal=`<div class="vg-reveal-box"><b>What you've discovered:</b><br>${d.discovered.map(x=>"• "+vgEscape(x)).join("<br>")}</div>`;
  }

  let buttons="";
  if(!d.completed){
    buttons=choices.map((c,i)=>`<button class="action" onclick="vgDynamicCareAction('${p.id}',${i})">${vgEscape(c)}</button>`).join("");
  } else {
    buttons=`<button class="action green" onclick="vgFinishDynamicCase('${p.id}')">Finish Case</button>`;
  }

  return `<div class="panel vg-dynamic-care">
    <div class="vg-dynamic-head">
      <div>
        <h3>${stageTitle}</h3>
        <div class="small">${vgEscape(p.species)} pathway · ${vgEscape(p.personality||"individual")} personality · ${vgDynamicStatus(p)}${d.stage==="recover"?`<div class="vg-recovery-phase"><b>${vgRecoveryPhaseName(p)}</b><span>${Math.min(20,d.recoveryCount||0)}/20 recovery actions</span></div>`:""}</div>
      </div>
      <span class="vg-stage-pill">${d.stage.toUpperCase()}</span>
    </div>
    ${reveal}
    <div class="small" style="margin:8px 0">Press an option. Each action reveals or improves the case a little, then the next set of choices changes.</div>
    <div class="vg-dynamic-buttons">${buttons}</div>
  </div>`;
}

function vgDynamicCareAction(id,choiceIndex){
  const p=state.patients.find(x=>x.id===id);
  if(!p)return;
  const d=vgEnsureDynamicCare(p);
  const choices=vgDynamicChoices(p);
  const choice=choices[choiceIndex]||choices[0]||"Care";
  d.step++;
  d.notes.push(choice);

  if(d.stage==="discover"){
    d.revealCount++;
    const db=VG_ANIMAL_DATABASE.find(a=>a.dbId===p.dbId);
    const problem=db?.problems?.[(d.revealCount-1)%Math.max(1,db.problems.length)];
    const revealText=problem ? problem.name : (p.condition||"Needs further assessment");
    if(!d.discovered.includes(revealText))d.discovered.push(revealText);

    p.stress=Math.max(0,(p.stress||50)-4);
    p.pain=Math.max(0,(p.pain||40)-2);

    if(d.revealCount>=3){
      d.stage="treat";
      d.step=0;
      addLog(`${p.name}: enough findings gathered to begin treatment`);
    }
  }
  else if(d.stage==="treat"){
    d.treatmentCount++;
    p.pain=Math.max(0,(p.pain||40)-7);
    p.stress=Math.max(0,(p.stress||50)-6);
    p.shock=Math.max(0,(p.shock||20)-5);
    p.infection=Math.max(0,(p.infection||10)-3);
    p.bleeding=Math.max(0,(p.bleeding||10)-4);
    p.oxygen=Math.min(100,(p.oxygen||92)+2);
    p.hydration=Math.min(100,(p.hydration||60)+5);

    try{
      const t=ensureTree(p);
      t.fear=Math.max(0,(t.fear||50)-5);
      t.trust=Math.min(100,(t.trust||25)+4);
      t.comfort=Math.min(100,(t.comfort||45)+5);
      t.hydration=Math.min(100,(t.hydration||60)+5);
      t.appetite=Math.min(100,(t.appetite||55)+3);
      t.mobility=Math.min(100,(t.mobility||55)+3);
    }catch(e){}

    if(d.treatmentCount>=4){
      d.stage="recover";
      d.step=0;
      p.department="Recovery";
      p.location="Recovery";
      addLog(`${p.name}: treatment phase complete, moved into Recovery`);
      state.screen="recovery";
    }
  }
  else if(d.stage==="recover"){
    d.recoveryCount++;
    p.pain=Math.max(0,(p.pain||30)-5);
    p.stress=Math.max(0,(p.stress||35)-5);
    p.hydration=Math.min(100,(p.hydration||65)+5);

    try{
      const t=ensureTree(p);
      t.fear=Math.max(0,(t.fear||40)-5);
      t.trust=Math.min(100,(t.trust||35)+5);
      t.comfort=Math.min(100,(t.comfort||55)+5);
      t.appetite=Math.min(100,(t.appetite||55)+5);
      t.mobility=Math.min(100,(t.mobility||55)+5);
    }catch(e){}

    if(d.recoveryCount>=20){
      d.stage="complete";
      d.completed=true;
      addLog(`${p.name}: dynamic care pathway complete`);
    }
  }

  state.activeId=p.id;
  if(typeof saveGame==="function")try{saveGame("Dynamic case progress",true)}catch(e){}
  render();
}

function vgFinishDynamicCase(id){
  const p=state.patients.find(x=>x.id===id);
  if(!p)return;
  const d=vgEnsureDynamicCare(p);
  if(!d.completed)return;

  if(p.canBecomePet){
    p.department="Home";
    p.location="Home";
    p.admitted=false;
    if(!state.pets.some(x=>x.id===p.id))state.pets.push(p);
    state.saved=(state.saved||0)+1;
    addLog(`${p.name} recovered and joined My Pets`);
    state.screen="pets";
  }else{
    p.admitted=false;
    p.department=p.disposition?.includes("Sanctuary")?"Sanctuary":"Home";
    p.location=p.department;
    if(p.department==="Sanctuary" && typeof EXP!=="undefined"){
      EXP.sanctuary=EXP.sanctuary||[];
      if(!EXP.sanctuary.some(x=>x.id===p.id))EXP.sanctuary.push(p);
      state.screen="sanctuary";
    }else{
      state.screen="lifebook";
    }
    addLog(`${p.name} completed care · ${p.disposition||"discharged"}`);
  }
  if(typeof saveGame==="function")try{saveGame("Case completed",true)}catch(e){}
  render();
}

/* Inject dynamic pathways into Clinic and Recovery without replacing the existing game loop. */
const _vgDynamicRenderClinic = renderClinic;

function vgHabitatForAnimal(p){
  const group=VG_SPECIES_GROUP[p.species]||"";
  return VG_HABITAT_CATALOG.filter(x=>x.group===group);
}
function vgHabitatLink(item){
  return `<a class="vg-habitat-buy" href="${vgAmazonSearch(item.search)}" onclick="return vgOpenExternal(this.href)">Search Amazon for enclosure ↗</a>`;
}
function vgHabitatPanelForAnimal(p){
  if(!p)return "";
  const items=vgHabitatForAnimal(p);
  if(!items.length)return "";
  return `<div class="panel vg-habitat-panel">
    <h3>🏠 Habitat / Enclosure Needs</h3>
    <div class="small">${vgEscape(p.name)} · ${vgEscape(p.species)}</div>
    <div class="vg-habitat-mini-grid">${items.map(x=>`
      <div class="vg-habitat-mini">
        <b>${x.icon} ${vgEscape(x.title)}</b>
        <div class="small">${vgEscape(x.desc)}</div>
        ${vgHabitatLink(x)}
      </div>`).join("")}
    </div>
  </div>`;
}
function renderHabitats(){
  const el=document.getElementById("habitats");
  if(!el)return;
  const p=active();
  el.innerHTML=`
    <div class="panel">
      <h2>🏠 Habitat & Enclosure Center</h2>
      <div class="small">Build the right home for spiders, ants, insects, amphibians and other exotics. No game money or credits — these are general enclosure searches.</div>
    </div>
    ${p?vgHabitatPanelForAnimal(p):""}
    <div class="panel">
      <h3>Exotic Enclosure Library</h3>
      <div class="vg-habitat-grid">${VG_HABITAT_CATALOG.map(x=>`
        <div class="vg-habitat-card">
          <div class="vg-habitat-icon">${x.icon}</div>
          <b>${vgEscape(x.title)}</b>
          <div class="small">${vgEscape(x.desc)}</div>
          ${vgHabitatLink(x)}
        </div>`).join("")}
      </div>
    </div>`;
}

/* Add habitat needs to animal profiles. */
const _vgHabitatAnimalProfileHTML = animalProfileHTML;
animalProfileHTML=function(p){
  return _vgHabitatAnimalProfileHTML(p) + vgHabitatPanelForAnimal(p);
};

/* Add problem/solution information to Animal Profile if the patient came from the database. */
const _vgOriginalAnimalProfileHTML = typeof animalProfileHTML==="function" ? animalProfileHTML : null;
if(_vgOriginalAnimalProfileHTML){
  animalProfileHTML=function(p){
    let base=_vgOriginalAnimalProfileHTML(p);
    const db=VG_ANIMAL_DATABASE.find(a=>a.dbId===p.dbId);
    if(!db)return base;
    const extra=`<div class="panel vg-case-plan">
      <h3>Case Problems & Solutions</h3>
      <div class="small"><b>Likely outcome:</b> ${vgEscape(db.disposition)}</div>
      ${db.problems.map(vgProblemCard).join("")}
    </div>`;
    return base+extra;
  };
}

// Load persistent game first. Only create the starter patient on a truly new game.
const hadSave=loadGame();
if(!hadSave){
  const starter=makePatient(0);
  starter.stress=62;starter.pain=48;starter.shock=34;starter.bleeding=22;starter.infection=12;starter.oxygen=82;
  state.patients.push(starter);state.activeId=starter.id;addLog(starter.name+" admitted to Clinic");
  SAVE_STATUS="New game · autosave active";
}
SAVE_READY=true;
render();

window.addEventListener("beforeunload",()=>{if(SAVE_READY)saveGame("Auto Save",true)});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&SAVE_READY)saveGame("Auto Save",true)});
