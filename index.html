<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VET GODS REBORN</title>
<style>
:root{
  --bg:#071018;--panel:#0d1822;--panel2:#111f2b;--line:#20394b;--text:#eaf7ff;--muted:#8aa7b8;
  --cyan:#6fe7ff;--green:#76e6a7;--amber:#ffc96d;--red:#ff8088;--violet:#ae91ff;--shadow:0 14px 40px rgba(0,0,0,.32)
}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 20% 0,#102538 0,#071018 42%,#050a0f 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh}.hidden{display:none!important}
button,input,select{font:inherit}.app{max-width:1180px;margin:auto;min-height:100vh;padding:0 12px 40px}
.topbar{position:sticky;top:0;z-index:50;padding:10px 0;background:linear-gradient(#071018f7,#071018e8 70%,transparent)}
.toprow{display:flex;gap:9px;align-items:center}.brand{flex:1}.brand b{display:block;font-size:18px;letter-spacing:.08em}.brand small{color:var(--muted)}
.iconbtn,.btn{border:1px solid var(--line);background:linear-gradient(#142533,#0c1720);color:var(--text);border-radius:12px;min-height:42px;padding:8px 12px;box-shadow:inset 0 1px rgba(255,255,255,.03);cursor:pointer}
.btn:hover,.iconbtn:hover{border-color:#3a627b}.btn.primary{border-color:#3286a0;background:linear-gradient(#123547,#0f2430)}.btn.good{border-color:#397c57}.btn.warn{border-color:#956f30}.btn.danger{border-color:#8b4650}
.drawer{margin-top:9px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#0a141dcc;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.drawer button{min-height:42px}
.statusline{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pill{padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:#0a151e;font:700 11px/1.1 ui-monospace,monospace}.pill.good{border-color:#2c7651}.pill.warn{border-color:#89642c}.pill.bad{border-color:#82434b}
.screen{display:none}.screen.active{display:block}
.hero{margin-top:8px;padding:18px;border-radius:22px;border:1px solid var(--line);background:
linear-gradient(145deg,rgba(18,38,53,.96),rgba(9,17,25,.98));box-shadow:var(--shadow)}
.hero h1,.hero h2,.hero h3{margin:.1em 0}.hero p{color:#a7bfcc}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{padding:13px;border-radius:17px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(18,31,43,.96),rgba(9,17,24,.98));box-shadow:0 8px 28px rgba(0,0,0,.18)}
.card h3,.card h4{margin:0 0 7px}.muted{color:var(--muted)}.tiny{font-size:11px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.actions .btn{flex:1 1 130px}
.metric{display:grid;grid-template-columns:110px 1fr 42px;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.track{height:8px;border-radius:99px;background:#071017;overflow:hidden;border:1px solid #172a36}.fill{height:100%;width:var(--v);background:linear-gradient(90deg,var(--cyan),var(--violet))}
.fill.good{background:linear-gradient(90deg,#4dcf89,#8af0b9)}.fill.warn{background:linear-gradient(90deg,#e7a643,#ffd98a)}.fill.bad{background:linear-gradient(90deg,#d94c60,#ff8d92)}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.gauge{position:relative;min-height:120px;border:1px solid var(--line);border-radius:16px;background:radial-gradient(circle,#112737,#09131c 68%);display:grid;place-items:center;text-align:center;overflow:hidden}
.dial{width:82px;height:82px;border-radius:50%;border:8px solid #173345;position:relative;box-shadow:inset 0 0 18px #000a}
.dial:before{content:"";position:absolute;left:37px;bottom:36px;width:3px;height:29px;border-radius:3px;background:var(--cyan);transform-origin:50% 100%;transform:rotate(var(--ang));box-shadow:0 0 9px var(--cyan)}
.dial:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#dffaff;left:33px;bottom:31px}
.gauge strong{display:block;font-size:19px}.gauge small{color:var(--muted)}
.timeline{display:grid;gap:6px}.event{padding:8px 10px;border-left:3px solid #315871;background:#0a151e;border-radius:9px;font-size:12px}.event.good{border-color:#4fa878}.event.warn{border-color:#b48335}.event.bad{border-color:#a34d58}
.diffs{display:grid;gap:6px}.diff{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;padding:8px;border:1px solid #182b38;border-radius:11px;background:#08121a}.diff b{text-align:right}
.scene{position:relative;height:210px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:
radial-gradient(circle at 50% 35%,#18384b 0,#0a1923 38%,#071017 75%)}
.station{position:absolute;padding:6px 8px;border:1px solid #28485b;border-radius:10px;background:#0b1923cc;font-size:10px}
.st-rest{left:5%;top:12%}.st-water{right:5%;top:12%}.st-food{left:6%;bottom:12%}.st-hide{right:6%;bottom:12%}.st-care{left:42%;top:6%}.st-explore{left:42%;bottom:7%}
.animal{position:absolute;left:46%;top:45%;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:radial-gradient(circle,#2c5970,#102431);border:2px solid #70e7ff;box-shadow:0 0 24px #4fcbe944;transition:left 1.8s ease,top 1.8s ease}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--muted)}input,select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:#08131c;color:var(--text);padding:8px}
.case-banner{padding:12px;border-radius:14px;background:linear-gradient(90deg,#173447aa,#241d38aa);border:1px solid #35536a}
.debug{font:11px/1.5 ui-monospace,monospace;background:#050b10;border:1px dashed #405463;border-radius:12px;padding:10px;max-height:220px;overflow:auto}
@media(max-width:760px){.drawer{grid-template-columns:repeat(2,1fr)}.grid,.grid3{grid-template-columns:1fr}.gauges{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.metric{grid-template-columns:90px 1fr 38px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="toprow">
      <button class="iconbtn" id="menuBtn">☰</button>
      <div class="brand"><b>VET GODS REBORN</b><small>Unified living veterinary simulation</small></div>
      <button class="iconbtn" id="saveBtn">💾</button>
    </div>
    <nav class="drawer hidden" id="drawer"></nav>
    <div class="statusline" id="statusline"></div>
  </header>
  <main id="screens"></main>
</div>
<script>
'use strict';
const U={
 clamp:(v,a=0,b=100)=>Math.max(a,Math.min(b,Number(v)||0)),
 rnd:(a,b)=>Math.floor(Math.random()*(b-a+1))+a,
 pick:a=>a[Math.floor(Math.random()*a.length)],
 uid:()=>Math.random().toString(36).slice(2)+Date.now().toString(36),
 esc:s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),
 now:()=>Date.now()
};
const SpeciesRules={
 families:{
  Dog:{family:'canine',icon:'🐕',cases:['Soft-tissue pain','GI upset','Respiratory problem','Skin/wound issue'],completion:['stable','pain','primary','hydration','nutrition','mobility','emotional']},
  Cat:{family:'feline',icon:'🐈',cases:['Hidden pain','GI/appetite disorder','Respiratory problem','Stress-linked urinary problem'],completion:['stable','pain','primary','hydration','nutrition','mobility','emotional']},
  Rabbit:{family:'rabbit',icon:'🐇',cases:['GI slowdown','Dental-linked appetite loss','Pain/stress anorexia','Respiratory problem'],completion:['stable','pain','primary','hydration','nutrition','gi','emotional']},
  Bird:{family:'avian',icon:'🦜',cases:['Nutrition-linked illness','Respiratory disease','Perch/foot problem','Reproductive emergency'],completion:['stable','primary','nutrition','respiratory','environment','activity']},
  Reptile:{family:'reptile',icon:'🦎',cases:['Thermal-gradient failure','Humidity/shed disorder','Respiratory husbandry case','Nutrition/UV imbalance'],completion:['stable','primary','environment','nutrition','activity']},
  Horse:{family:'equine',icon:'🐎',cases:['Colic-type problem','Hoof/laminitis-type issue','Lameness','Field trauma'],completion:['stable','pain','primary','hydration','nutrition','mobility']},
  Fish:{family:'aquatic',icon:'🐠',cases:['Water-quality crisis','Low dissolved oxygen','Temperature stress','Infectious problem'],completion:['stable','primary','environment','oxygen','nutrition','swimming']},
  Ferret:{family:'ferret',icon:'🦦',cases:['Foreign-body pattern','Endocrine weakness','Cardiorespiratory issue','GI recovery'],completion:['stable','pain','primary','hydration','nutrition','mobility']},
  Rodent:{family:'rodent',icon:'🐹',cases:['Dental overgrowth','Respiratory issue','Skin/parasite issue','Trauma'],completion:['stable','pain','primary','hydration','nutrition','activity']},
  Amphibian:{family:'amphibian',icon:'🐸',cases:['Water/skin environment issue','Temperature/humidity stress','Nutrition loss','Trauma'],completion:['stable','primary','environment','nutrition','activity']},
  Arachnid:{family:'arachnid',icon:'🕷️',cases:['Molt risk','Enclosure stress','Dehydration','Fall trauma'],completion:['stable','primary','environment','nutrition','posture']},
  Colony:{family:'colony',icon:'🐜',cases:['Environment drift','Resource imbalance','Contamination','Nest stress'],completion:['environment','resources','brood','foraging']}
 },
 rule(species){return this.families[species]||this.families.Dog}
};
const SaveManager={
 key:'vetGodsRebornSaveV1',
 save(){localStorage.setItem(this.key,JSON.stringify(GameState.data));GameState.data.meta.lastSave=U.now();UI.toast('Game saved')},
 load(){try{let s=JSON.parse(localStorage.getItem(this.key)||'null');if(s&&s.version===1)GameState.data=s}catch(e){}},
 export(){let blob=new Blob([JSON.stringify(GameState.data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vet-gods-reborn-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)},
 reset(){if(confirm('Reset this Vet Gods Reborn save?')){localStorage.removeItem(this.key);location.reload()}}
};
const GameState={
 data:null,
 defaults(){return {version:1,screen:'hospital',activeId:null,patients:[],pets:[],lifeBook:[],clock:{day:1,minute:480},mission:null,events:[],settings:{reducedMotion:false,largeText:false},resources:{oxygen:2,imaging:1,isolation:2,surgery:1,specialist:1},meta:{lastSave:0,lastTick:U.now(),audits:0}}},
 init(){this.data=this.defaults();SaveManager.load();if(!this.data.patients.length)this.seed()},
 seed(){
  let p=PatientModel.create({name:'Atlas',species:'Dog',breed:'Mixed rescue',severity:62,mystery:true});
  this.data.patients.push(p);this.data.activeId=p.id;MissionDirector.createFor(p)
 },
 get active(){return [...this.data.patients,...this.data.pets].find(x=>x.id===this.data.activeId)||this.data.patients[0]||this.data.pets[0]||null}
};
const PatientModel={
 create(o={}){
  let r=SpeciesRules.rule(o.species||'Dog'),sev=o.severity??U.rnd(35,78),trueCase=U.pick(r.cases);
  let diffs=r.cases.map((x,i)=>({label:x,score:i===0?52:U.rnd(12,40)})).sort((a,b)=>b.score-a.score);
  return {
   id:U.uid(),name:o.name||U.pick(['Atlas','Kira','Nova','Milo','Luna','Echo','Juniper','Rowan','Pip','Sage']),
   species:o.species||'Dog',breed:o.breed||'Mixed',age:o.age||'Adult',weight:o.weight||'',icon:r.icon,
   admitted:true,location:'Clinic',department:'Clinic',severity:sev,condition:o.mystery?'Undifferentiated case':trueCase,trueCase,
   vitals:{oxygen:U.clamp(98-sev*.13),hydration:U.clamp(88-sev*.28),pain:U.clamp(sev*.75),stress:U.clamp(sev*.68),trust:U.rnd(24,50),hunger:U.clamp(90-sev*.5),energy:U.clamp(88-sev*.5),mobility:U.clamp(92-sev*.55),shock:U.clamp(sev-55),bleeding:0,infection:U.clamp(sev-45)},
   environment:{temperature:50,humidity:50,quality:58,corrected:false},
   personality:{bold:U.rnd(25,80),social:U.rnd(20,85),food:U.rnd(25,90),curious:U.rnd(25,85),resilience:U.rnd(30,90),stressSensitive:U.rnd(25,85)},
   ai:{station:'care',activity:'watching caregiver',nextDecision:0,bond:20,memories:[]},
   diagnostics:{differentials:diffs,tests:{},working:null,evidence:[]},
   recovery:{trend:'GATHERING',forecast:'BASELINE',snapshots:[],relapseRisk:0,restCycles:0},
   treatment:{pending:[],history:[],primaryResolved:false,complications:[]},
   milestones:{drink:false,meal:false,mobility:false,emotional:false,environment:false,activity:false,gi:false,respiratory:false,oxygen:false,swimming:false,posture:false,resources:false,brood:false,foraging:false},
   history:[{at:U.now(),text:'Patient arrived at Vet Gods Reborn.'}],
   outcome:null
  }
 }
};
const DiagnosticEngine={
 test(p,type){
  if(!p)return;let last=p.diagnostics.tests[type]||0;if(U.now()-last<12000){Log.add(p,`${type} repeated too soon; no new information.`,'warn');return}
  p.diagnostics.tests[type]=U.now();
  let target=p.trueCase.toLowerCase(),keys={environment:['water','temperature','humidity','enclosure','husbandry','nest','resource'],respiratory:['respiratory','oxygen','cardio'],nutrition:['gi','appetite','nutrition','dental','foreign'],mobility:['pain','lameness','hoof','trauma','foot'],imaging:['foreign','trauma','lameness','injury','soft']};
  p.diagnostics.differentials.forEach(d=>{let boost=U.rnd(-7,8);if((keys[type]||[]).some(k=>d.label.toLowerCase().includes(k)))boost+=18;if(d.label===p.trueCase)boost+=U.rnd(5,14);d.score=U.clamp(d.score+boost)});
  p.diagnostics.differentials.sort((a,b)=>b.score-a.score);
  p.diagnostics.working=p.diagnostics.differentials[0].score>=70?p.diagnostics.differentials[0].label:null;
  p.diagnostics.evidence.unshift(`${type}: evidence shifted diagnostic confidence.`);
  Log.add(p,`${type} evidence updated the differential list.`,'good');MissionDirector.update(p)
 }
};
const TreatmentEngine={
 act(p,id){
  if(!p)return;
  const v=p.vitals;
  if(id==='water'){
   let willing=this.willing(p,'water');if(willing){v.hydration=U.clamp(v.hydration+7);p.milestones.drink=true;p.ai.bond=U.clamp(p.ai.bond+2);Log.add(p,'Water offered → patient approached → voluntary drinking occurred.','good')}
   else{v.stress=U.clamp(v.stress+1);Log.add(p,'Water offered → patient declined because fear/pain outweighed willingness.','warn')}
  }
  if(id==='food'){
   let willing=this.willing(p,'food');if(willing){v.hunger=U.clamp(v.hunger+7);v.energy=U.clamp(v.energy+2);p.milestones.meal=true;Log.add(p,'Food offered → patient investigated → voluntary intake occurred.','good')}
   else Log.add(p,'Food offered → patient showed interest but did not eat.','warn')
  }
  if(id==='comfort'){v.pain=U.clamp(v.pain-6);v.stress=U.clamp(v.stress-5);v.trust=U.clamp(v.trust+4);p.milestones.emotional=v.stress<45&&v.trust>45;Log.add(p,'Comfort accepted → pain and distress decreased.','good')}
  if(id==='rest'){v.energy=U.clamp(v.energy+5);v.stress=U.clamp(v.stress-3);p.recovery.restCycles++;Log.add(p,'Quiet rest cycle completed.','good')}
  if(id==='mobility'){if(v.pain<55&&v.energy>35){v.mobility=U.clamp(v.mobility+8);p.milestones.mobility=v.mobility>=65;p.milestones.activity=true;Log.add(p,'Guarded mobility trial completed.','good')}else Log.add(p,'Mobility attempt limited by pain or low energy.','warn')}
  if(id==='respiratory'){p.treatment.pending.push({due:U.now()+9000,type:'respiratory'});Log.add(p,'Respiratory support started; response will be observed over time.','good')}
  if(id==='environment'){p.environment.corrected=true;p.environment.quality=82;p.milestones.environment=true;p.milestones.resources=true;p.milestones.brood=true;p.milestones.foraging=true;Log.add(p,'Species environment corrected and stabilized.','good')}
  if(id==='primary'){
   if(p.diagnostics.working||p.diagnostics.evidence.length>=2){p.treatment.pending.push({due:U.now()+12000,type:'primary'});Log.add(p,'Primary treatment plan started; response is pending.','good')}
   else Log.add(p,'Primary treatment requires stronger diagnostic evidence first.','warn')
  }
  p.treatment.history.unshift({at:U.now(),id});p.ai.memories.unshift(id);MissionDirector.update(p);CompletionEngine.check(p)
 },
 willing(p,kind){let v=p.vitals,base=48+v.trust*.35-v.stress*.25-v.pain*.18;if(kind==='water')base+=(100-v.hydration)*.3;if(kind==='food')base+=(100-v.hunger)*.26+p.personality.food*.12;return base>=55}
};
const ConsequenceEngine={
 tick(p){
  let v=p.vitals,why=[];
  if(v.pain>60){v.hunger=U.clamp(v.hunger-.7);v.mobility=U.clamp(v.mobility-.45);why.push('high pain suppressed appetite and movement')}
  if(v.stress>65){v.hunger=U.clamp(v.hunger-.5);v.trust=U.clamp(v.trust-.3);why.push('high stress reduced intake and trust')}
  if(v.hydration<50){v.energy=U.clamp(v.energy-.5);v.mobility=U.clamp(v.mobility-.3);why.push('low hydration reduced energy')}
  if(v.hunger<45)v.energy=U.clamp(v.energy-.35);
  if(v.energy<40)v.mobility=U.clamp(v.mobility-.35);
  if(v.oxygen<90){v.stress=U.clamp(v.stress+.6);v.shock=U.clamp(v.shock+.35);why.push('low oxygen increased physiologic stress')}
  if(v.pain<35&&v.stress<45&&v.hydration>65)v.energy=U.clamp(v.energy+.25);
  why.forEach(x=>Log.addWhy(p,x));
  p.treatment.pending=p.treatment.pending.filter(q=>{
    if(U.now()<q.due)return true;
    if(q.type==='respiratory'){v.oxygen=U.clamp(v.oxygen+8);p.milestones.respiratory=true;p.milestones.oxygen=v.oxygen>=93;Log.add(p,'Delayed respiratory response observed: oxygen improved.','good')}
    if(q.type==='primary'){p.treatment.primaryResolved=true;v.pain=U.clamp(v.pain-8);v.infection=U.clamp(v.infection-10);Log.add(p,'Primary treatment response observed.','good')}
    return false
  });
  if(v.pain<40&&p.environment.corrected===false&&['reptile','aquatic','avian','colony','amphibian','arachnid'].includes(SpeciesRules.rule(p.species).family)){
    p.recovery.relapseRisk=U.clamp(p.recovery.relapseRisk+.5)
  }else p.recovery.relapseRisk=U.clamp(p.recovery.relapseRisk-.2);
 }
};
const AnimalAI={
 tick(p){
  if(U.now()<p.ai.nextDecision)return;let v=p.vitals,rule=SpeciesRules.rule(p.species).family,choice='explore';
  if(v.energy<38)choice='rest';else if(v.hydration<48)choice='water';else if(v.hunger<48)choice='food';else if(v.stress>58)choice='hide';else if(v.trust>55&&p.personality.social>45)choice='care';
  if(rule==='reptile'&&!p.environment.corrected)choice='hide';if(rule==='aquatic')choice=v.oxygen<92?'water':'explore';if(rule==='avian'&&v.stress>45)choice='rest';
  p.ai.station=choice;p.ai.activity={rest:'resting',water:'seeking water',food:'investigating food',hide:'seeking safety',care:'approaching caregiver',explore:'exploring'}[choice];
  p.ai.nextDecision=U.now()+U.rnd(18000,36000)
 }
};
const RecoveryEngine={
 snapshot(p){
  let r=p.recovery,v=p.vitals;r.snapshots.push({at:U.now(),oxygen:v.oxygen,hydration:v.hydration,pain:v.pain,stress:v.stress,energy:v.energy,mobility:v.mobility});r.snapshots=r.snapshots.slice(-8);
  if(r.snapshots.length<3){r.trend='GATHERING';return}
  let a=r.snapshots[r.snapshots.length-3],b=r.snapshots.at(-1),score=(b.oxygen-a.oxygen)+(b.hydration-a.hydration)+(a.pain-b.pain)+(a.stress-b.stress)+(b.energy-a.energy)+(b.mobility-a.mobility);
  r.trend=score>8?'IMPROVING':score<-8?'DETERIORATING':Math.abs(score)<3?'STALLED':'MIXED';
  r.forecast=r.trend==='IMPROVING'?'AHEAD / ON CURVE':r.trend==='DETERIORATING'?'BEHIND CURVE':r.trend==='STALLED'?'REASSESS':'ON CURVE'
 }
};
const CompletionEngine={
 flags(p){
  let v=p.vitals,m=p.milestones,base={
   stable:v.oxygen>=92&&v.shock<35&&v.bleeding<35,pain:v.pain<45,primary:p.treatment.primaryResolved,
   hydration:v.hydration>=60&&m.drink,nutrition:v.hunger>=55&&m.meal,mobility:v.mobility>=60&&m.mobility,
   emotional:v.stress<50&&v.trust>=40,environment:p.environment.corrected,activity:m.activity||v.energy>55,
   gi:m.meal&&v.hunger>=55,respiratory:v.oxygen>=92,oxygen:v.oxygen>=92,swimming:v.energy>50&&v.oxygen>=92,
   posture:v.energy>45&&v.stress<55,resources:p.environment.corrected,brood:p.environment.corrected,foraging:p.environment.corrected
  };return base
 },
 check(p){
  let req=SpeciesRules.rule(p.species).completion,f=this.flags(p);return {required:req,flags:f,ready:req.every(k=>f[k])}
 },
 finish(p){
  let c=this.check(p);if(!c.ready){Log.add(p,'Final Check blocked: visible recovery requirements remain.','warn');return}
  p.admitted=false;p.location='Home';p.department='Home';p.outcome='Returned Home / Follow-Up';GameState.data.lifeBook.unshift({id:p.id,name:p.name,species:p.species,case:p.trueCase,outcome:p.outcome,at:U.now()});Log.add(p,'CASE COMPLETE — patient cleared for outcome routing.','good');MissionDirector.update(p)
 }
};
const MissionDirector={
 createFor(p){GameState.data.mission={patientId:p.id,title:'Living Case',steps:['stabilize','investigate','primary','independence','final'],done:{},complete:false}},
 update(p){let m=GameState.data.mission;if(!m||m.patientId!==p.id)return;let c=CompletionEngine.check(p);m.done.stabilize=c.flags.stable;m.done.investigate=p.diagnostics.evidence.length>=2;m.done.primary=p.treatment.primaryResolved;m.done.independence=c.flags.hydration&&c.flags.nutrition;m.done.final=c.ready;m.complete=Object.values(m.done).every(Boolean)}
};
const Log={

const SystemAuditor={
 run(repair=true){
  let d=GameState.data,issues=[],repairs=[],seen=new Set();
  d.patients=d.patients.filter(p=>{if(seen.has(p.id)){issues.push('duplicate patient '+p.id);if(repair){repairs.push('removed duplicate patient');return false}}seen.add(p.id);return true});
  let petIds=new Set();d.pets=d.pets.filter(p=>{if(petIds.has(p.id)){issues.push('duplicate pet '+p.id);if(repair){repairs.push('removed duplicate pet');return false}}petIds.add(p.id);return true});
  d.patients=d.patients.filter(p=>{if(petIds.has(p.id)){issues.push(p.name+' exists in Patients and My Pets');if(repair){repairs.push('removed hospital duplicate for '+p.name);return false}}return true});
  let ids=new Set([...d.patients,...d.pets].map(x=>x.id));if(d.activeId&&!ids.has(d.activeId)){issues.push('active patient pointer missing');if(repair){d.activeId=(d.patients[0]||d.pets[0]||{}).id||null;repairs.push('repaired active pointer')}}
  d.patients.forEach(p=>{if(p.outcome&&p.admitted){issues.push(p.name+' completed but still admitted');if(repair){p.admitted=false;repairs.push('cleared admitted flag for '+p.name)}}});
  d.meta.audits=(d.meta.audits||0)+1;d.audit={issues,repairs,health:Math.max(0,100-issues.length*15)};return d.audit
 }
};

  d.patients.filter(p=>p.admitted).forEach(p=>{ConsequenceEngine.tick(p);AnimalAI.tick(p);if(!p._snap||now-p._snap>15000){RecoveryEngine.snapshot(p);p._snap=now}});
  SystemAuditor.run(true);UI.renderStatus();if(['clinic','recovery','mypets','habitats','surgery'].includes(d.screen))UI.renderScreen();if(now-d.meta.lastSave>30000)SaveManager.save()

 run(id){

 }

 admit(){let p=PatientModel.create({name:document.getElementById('inName').value||undefined,species:document.getElementById('inSpecies').value,breed:document.getElementById('inBreed').value||'Mixed',age:document.getElementById('inAge').value,severity:+document.getElementById('inSeverity').value,mystery:document.getElementById('inMode').value==='mystery'});GameState.data.patients.push(p);GameState.data.activeId=p.id;MissionDirector.createFor(p);Router.go('clinic')},
 randomAdmit(){let species=U.pick(Object.keys(SpeciesRules.families)),p=PatientModel.create({species,severity:U.rnd(35,88),mystery:true});GameState.data.patients.push(p);GameState.data.activeId=p.id;MissionDirector.createFor(p);Router.go('clinic')},
 surgery(){let p=GameState.active;if(!p)return this.hero('Surgery','No active patient.');return `${this.hero('🫀 Operating Theater','Fictionalized direct-control surgical pathway tied to the same patient state.')}<div class="grid"><div class="card"><h3>${p.icon} ${U.esc(p.name)} · Surgical Readout</h3>${this.gauges(p)}<div class="actions"><button class="btn" onclick="TreatmentEngine.act(GameState.active,'comfort');UI.renderAll()">Pre-op Comfort</button><button class="btn" onclick="TreatmentEngine.act(GameState.active,'respiratory');UI.renderAll()">Oxygen Support</button><button class="btn primary" onclick="GameState.active.location='Surgery';GameState.active.department='Surgery';TreatmentEngine.act(GameState.active,'primary');UI.renderAll()">Perform Fictional Procedure</button></div></div><div class="card"><h3>Device Console</h3>${this.metric('Temperature',U.clamp(100-GameState.active.vitals.stress*.3))}${this.metric('Oxygen',p.vitals.oxygen)}${this.metric('Circulation',U.clamp(100-p.vitals.shock))}${this.metric('Comfort',U.clamp(100-p.vitals.pain))}<p class="tiny muted">Simulation only. No real surgical steps or dosing are provided.</p></div></div>`},
 recovery(){let p=GameState.active;if(!p)return this.hero('Recovery','No active patient.');return `${this.hero('💚 Recovery & Independence','Recovery is trend-based, species-aware, and connected to voluntary behavior.')}<div class="grid"><div class="card"><h3>Recovery Forecast</h3><p><b>${p.recovery.trend}</b><br>${p.recovery.forecast}<br>Rest cycles: ${p.recovery.restCycles}<br>Relapse risk: ${Math.round(p.recovery.relapseRisk)}%</p><div class="actions"><button class="btn" onclick="TreatmentEngine.act(GameState.active,'rest');UI.renderAll()">Quiet Rest</button><button class="btn" onclick="TreatmentEngine.act(GameState.active,'water');UI.renderAll()">Offer Water</button><button class="btn" onclick="TreatmentEngine.act(GameState.active,'food');UI.renderAll()">Offer Food</button><button class="btn" onclick="TreatmentEngine.act(GameState.active,'mobility');UI.renderAll()">Guarded Activity</button></div></div><div class="card"><h3>Independence</h3>${['drink','meal','mobility','emotional','environment','activity'].map(k=>`<div class="event ${p.milestones[k]?'good':'warn'}">${p.milestones[k]?'✅':'⬜'} ${k}</div>`).join('')}</div></div>`},
 mypets(){return `${this.hero('🐾 My Pets','Animals retained by the player use the same AI, memory and care model.')}<div class="grid">${GameState.data.pets.length?GameState.data.pets.map(p=>`<div class="card"><h3>${p.icon} ${U.esc(p.name)}</h3><p>${U.esc(p.species)} · ${U.esc(p.ai.activity)}</p>${this.metric('Trust',p.vitals.trust)}${this.metric('Hydration',p.vitals.hydration)}${this.metric('Nutrition',p.vitals.hunger)}</div>`).join(''):'<div class="card"><p>No My Pets animals yet. Completed hospital cases can later be routed here.</p></div>'}</div>`},
 habitats(){let p=GameState.active;if(!p)return this.hero('Habitats','No active patient.');return `${this.hero('🌿 Species Habitat Console','Habitat corrections directly satisfy patient recovery logic.')}<div class="grid"><div class="card"><h3>${p.icon} ${U.esc(p.species)} Environment</h3>${this.metric('Environment quality',p.environment.quality)}${this.metric('Temperature fit',p.environment.temperature)}${this.metric('Humidity / water fit',p.environment.humidity)}<div class="actions"><button class="btn good" onclick="TreatmentEngine.act(GameState.active,'environment');UI.renderAll()">Correct Species Environment</button></div></div><div class="card"><h3>Species Rules</h3><p>Family: <b>${SpeciesRules.rule(p.species).family}</b></p><p>Completion: ${SpeciesRules.rule(p.species).completion.join(' · ')}</p></div></div>`},
 missions(){let m=GameState.data.mission,p=GameState.active;return `${this.hero('🎯 Mission Director','Shifts are assembled from the living patient state instead of separate scripted copies.')}<div class="card">${m&&p?`<h3>${U.esc(m.title)} · ${U.esc(p.name)}</h3>${m.steps.map(x=>`<div class="event ${m.done[x]?'good':'warn'}">${m.done[x]?'✅':'⬜'} ${x}</div>`).join('')}<p>${m.complete?'MISSION COMPLETE':'Free play remains open while this case progresses.'}</p>`:'No active mission.'}</div>`},
 lifebook(){return `${this.hero('📖 Life Book','Permanent case history and outcomes.')}<div class="grid">${GameState.data.lifeBook.length?GameState.data.lifeBook.map(x=>`<div class="card"><h3>${U.esc(x.name)} · ${U.esc(x.species)}</h3><p>${U.esc(x.case)}<br><b>${U.esc(x.outcome)}</b></p></div>`).join(''):'<div class="card"><p>No completed lives recorded yet.</p></div>'}</div>`},
 settings(){let a=GameState.data.audit||SystemAuditor.run(false);return `${this.hero('⚙ Settings & Hospital Systems Health','Save tools, accessibility and self-repair live here.')}<div class="grid"><div class="card"><h3>System Audit</h3><p>Health: <b>${a.health}%</b></p>${a.issues.length?a.issues.map(x=>`<div class="event warn">⚠ ${U.esc(x)}</div>`).join(''):'<div class="event good">✅ No contradictions detected.</div>'}<div class="actions"><button class="btn" onclick="SystemAuditor.run(true);UI.renderAll()">Audit + Repair</button></div></div><div class="card"><h3>Save Tools</h3><div class="actions"><button class="btn" onclick="SaveManager.save()">Save</button><button class="btn" onclick="SaveManager.export()">Export Save</button><button class="btn danger" onclick="SaveManager.reset()">Reset</button></div><label><input type="checkbox" ${GameState.data.settings.reducedMotion?'checked':''} onchange="GameState.data.settings.reducedMotion=this.checked"> Reduced motion</label></div></div>`},
 toast(msg){let x=document.createElement('div');x.textContent=msg;x.style='position:fixed;right:14px;bottom:14px;z-index:99;background:#102431;border:1px solid #37627a;padding:10px 14px;border-radius:12px;box-shadow:0 12px 30px #0008';document.body.appendChild(x);setTimeout(()=>x.remove(),1300)}
};
GameState.init();SystemAuditor.run(true);UI.init();SimulationEngine.start();
</script>
</body>
</html>
